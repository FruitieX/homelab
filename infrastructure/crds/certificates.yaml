  namespace: default
spec:
  secretName: lovegren-fi-tls
  issuerRef:
    kind: ClusterIssuer
    name: ${LETSENCRYPT_CLUSTER_ISSUER}
  dnsNames:
    - "lovegren.fi"
    - "*.lovegren.fi"
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "envoy-gateway-system" # Only the Envoy Gateways use the certificates
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true" # Auto create reflection for matching namespaces
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "envoy-gateway-system"
