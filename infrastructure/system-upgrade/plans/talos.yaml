# Talos version for every node. Changing it rolls the upgrade through the
# cluster at night; keep regen-configs.sh's TALOS_VERSION in step (Renovate
# bumps both). Talos only supports upgrading one minor at a time.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.14.5
  policy:
    # Per node, including the drain and coming back Ready.
    timeout: 30m
    drainTimeout: 10m
  maintenance:
    windows:
      - start: "0 2 * * *"
        duration: 3h
        timezone: Europe/Helsinki
  # Alerts that a rolling upgrade causes by design, silenced in Alertmanager
  # only while the run is active (tuppr re-extends a short lease), so a real
  # breakage still fires once the run ends.
  silences:
    - matchers:
        - name: alertname
          matchType: "=~"
          value: "KubeClientCertificateExpiration|KubeNodeNotReady|KubeNodeUnreachable|KubeletDown|TargetDown|AppDown|KubePodNotReady|KubePodCrashLooping|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeDaemonSetRolloutStuck|KubeDaemonSetMisScheduled|KubeAPIDown|KubeAPIErrorBudgetBurn|etcd.*"
      maxDuration: 4h
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgres-ha
      namespace: default
      expr: status.phase == "Cluster in healthy state"
      timeout: 15m
