# Kubernetes version of the cluster (no node reboots). Keep regen-configs.sh's
# KUBERNETES_VERSION in step (Renovate bumps both).
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.2
  maintenance:
    windows:
      - start: "0 2 * * *"
        duration: 3h
        timezone: Europe/Helsinki
      # TEMPORARY: first rollout, run now; remove once it completes.
      - start: "* * * * *"
        duration: 1h
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m
