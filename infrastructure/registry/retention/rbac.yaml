apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-protection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zot-protection
rules:
  - apiGroups: [""]
    resources: [pods, replicationcontrollers]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets, controllerrevisions]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zot-protection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zot-protection
subjects:
  - kind: ServiceAccount
    name: zot-protection
    namespace: registry-maintenance
