apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-runners
  namespace: arc-runners
spec:
  interval: 30m
  timeout: 10m
  dependsOn:
    - name: actions-runner-controller
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  values:
    # This URL scopes the scale set to this repository. Change to an org URL
    # if these runners should be shared by several repositories.
    githubConfigUrl: https://github.com/FruitieX/homelab
    githubConfigSecret: github-actions-runner

    # Workflows should use: runs-on: homelab
    runnerScaleSetName: homelab
    scaleSetLabels:
      - homelab

    # Keep one warm runner and allow a few concurrent jobs.
    minRunners: 1
    maxRunners: 4

    # DinD supports normal actions that build or run Docker images. This
    # requires the privileged Pod Security labels on the arc-runners namespace.
    containerMode:
      type: dind
