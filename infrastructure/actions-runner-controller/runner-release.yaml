apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-runners
  namespace: arc-runners
spec:
  interval: 30m
  timeout: 10m
  dependsOn:
    - name: actions-runner-controller
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  values:
    # This URL scopes the scale set to this repository. Change to an org URL
    # if these runners should be shared by several repositories.
    githubConfigUrl: https://github.com/FruitieX/homelab
    githubConfigSecret: github-actions-runner

    # Workflows should use: runs-on: homelab
    runnerScaleSetName: homelab
    scaleSetLabels:
      - homelab

    # Keep one warm runner and allow a few concurrent jobs.
    minRunners: 1
    maxRunners: 2

    # The only job here (flux-reconcile.yaml) runs curl, so the runner gets
    # no Docker-in-Docker and no privileges. See README.md for why public
    # repositories get no other runners.
    template:
      spec:
        # Runner pods yield to everything else when capacity is short.
        priorityClassName: homelab-batch
        # May only trigger Flux reconciles (flux-reconcile-rbac.yaml).
        serviceAccountName: homelab-runner
        automountServiceAccountToken: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2@sha256:6d0b2d80d80f143f77dcb676e50920100bbb547e39e883454d57f45ab8c31300
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
