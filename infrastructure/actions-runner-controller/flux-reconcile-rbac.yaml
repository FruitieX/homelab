# The homelab runners' identity: allowed only to ask Flux to re-fetch the
# flux-system GitRepository (.github/workflows/flux-reconcile.yaml). This
# replaces the public GitHub webhook receiver.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-runner
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-reconcile-trigger
  namespace: flux-system
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    resourceNames: ["flux-system"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-reconcile-trigger
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-reconcile-trigger
subjects:
  - kind: ServiceAccount
    name: homelab-runner
    namespace: arc-runners
