apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: reconciliation-alert
  namespace: flux-system
spec:
  eventMetadata:
    summary: "homelab cluster"
  providerRef:
    name: notification-provider
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
  # Transient API-server errors while control planes restart (node and
  # Kubernetes upgrades) resolve on the next reconcile; real failures (build
  # errors, failed health checks) still notify.
  exclusionList:
    - "failed to update status"
    - "connection reset by peer"
    - "connection refused"
    - "context canceled"
    - "unable to update the healthy status to progressing: timed out waiting for the condition"
