apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-notifier
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-notifier
  namespace: default
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [add-bot, homectl, forkbasket]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ghcr-credentials]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-notifier
  namespace: default
subjects:
  - kind: ServiceAccount
    name: deployment-notifier
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-notifier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-notifier-flux
  namespace: flux-system
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames: [add-bot, homectl, forkbasket]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-notifier-flux
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: deployment-notifier
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-notifier-flux
