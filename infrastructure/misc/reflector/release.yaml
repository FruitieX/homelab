apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector
spec:
  interval: 30m
  timeout: 3m
  chart:
    spec:
      chart: reflector
      version: 10.0.69
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
  values:
    priorityClassName: homelab-critical
    resources:
      requests:
        memory: 128Mi
