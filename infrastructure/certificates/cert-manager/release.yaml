apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  timeout: 3m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  values:
    installCRDs: true
    global:
      priorityClassName: homelab-critical
    resources:
      requests:
        memory: 32Mi
    cainjector:
      resources:
        requests:
          memory: 64Mi
    webhook:
      resources:
        requests:
          memory: 32Mi
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    podDnsConfig:
      nameservers:
        - "1.1.1.1"
        - "8.8.8.8"
