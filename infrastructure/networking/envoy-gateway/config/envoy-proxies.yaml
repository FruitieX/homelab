apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          image: docker.io/envoyproxy/envoy:distroless-v1.39.6@sha256:1cac8b3a2f72d5a0918f54d7b49e68aae0b0ba325c2d50c8a9a3fff7a4d1f994
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
        pod:
          priorityClassName: homelab-critical
          labels:
            homelab.fruitiex.org/gateway: public
          # One replica per physical host (zone = Proxmox host, see
          # talos/patches/hosts), and never two on the same node. Tainted
          # nodes (control planes, cordoned or dead nodes) don't count as
          # domains, so rollouts and drains still find room.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  homelab.fruitiex.org/gateway: public
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  homelab.fruitiex.org/gateway: public
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
      envoyPDB:
        minAvailable: 1
      envoyService:
        name: envoy-public
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          metallb.universe.tf/loadBalancerIPs: 192.168.11.1
          external-dns.alpha.kubernetes.io/exclude: "true"
---
