apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: envoy-gateway
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    global:
      images:
        envoyGateway:
          image: docker.io/envoyproxy/gateway:v1.9.3@sha256:192fc9bdadb6d2462e8cf7bd702ce3dd9648f3310c6038787448a1f509b7cd9f
        ratelimit:
          image: docker.io/envoyproxy/ratelimit:17b1956c@sha256:871098f54d99ad612abdd455e39632be6d990937be2e46eecf4e39f65d948a94
    deployment:
      replicas: 2
      priorityClassName: homelab-critical
      envoyGateway:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
      pod:
        # One replica per physical host and node; see envoy-proxies.yaml.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            nodeTaintsPolicy: Honor
            matchLabelKeys:
              - pod-template-hash
            labelSelector:
              matchLabels:
                control-plane: envoy-gateway
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            nodeTaintsPolicy: Honor
            matchLabelKeys:
              - pod-template-hash
            labelSelector:
              matchLabels:
                control-plane: envoy-gateway
    podDisruptionBudget:
      maxUnavailable: 1
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
          # Required by Nectarine's sharing-upload header workaround.
          enableLua: true
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
