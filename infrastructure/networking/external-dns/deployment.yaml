apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      priorityClassName: homelab-critical
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
          args:
            - --source=service
            - --source=gateway-httproute
            - --annotation-filter=external-dns.alpha.kubernetes.io/exclude notin (true)
            - --annotation-prefix=external-dns.alpha.kubernetes.io/
            - --domain-filter=fruitiex.org
            - --domain-filter=lovegren.fi
            - --provider=cloudflare
            - --policy=sync
            - --cloudflare-dns-records-per-page=5000
          env:
            - name: CF_API_EMAIL
              value: ${CLOUDFLARE_EMAIL}
            - name: CF_API_TOKEN
              value: ${EXTERNAL_DNS_CLOUDFLARE_API_TOKEN}
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 512Mi
              cpu: 500m
      securityContext:
        fsGroup: 65534 # For ExternalDNS to be able to read Kubernetes token files
