apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  timeout: 3m
  chart:
    spec:
      chart: metallb
      version: 0.13.9
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  releaseName: metallb
  values:
    controller:
      priorityClassName: homelab-critical
      resources:
        requests:
          memory: 96Mi
    speaker:
      priorityClassName: homelab-critical
      resources:
        requests:
          memory: 48Mi
