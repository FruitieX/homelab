apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  # Rolling the speaker DaemonSet across all nodes can take a few minutes.
  timeout: 10m
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  releaseName: metallb
  values:
    controller:
      priorityClassName: homelab-critical
      resources:
        requests:
          memory: 96Mi
    speaker:
      priorityClassName: homelab-critical
      resources:
        requests:
          memory: 48Mi
    # Only L2 advertisements are used. Since 0.16 the chart deploys the
    # frr-k8s BGP backend by default; keep the native (FRR-less) speaker.
    frrk8s:
      enabled: false
