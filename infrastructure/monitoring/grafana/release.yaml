apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
  annotations:
    # Keep Flux from rewriting ${...}/$__env{...} in Grafana settings.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    ingress:
      enabled: false
    resources:
      requests:
        memory: 192Mi
    # Sign-in through Pocket ID (admins group only); the local admin stays
    # reachable at /login?disableAutoLogin.
    envFromSecret: grafana-oidc
    grafana.ini:
      server:
        root_url: https://grafana.fruitiex.org
      dashboards:
        default_home_dashboard_path: /tmp/dashboards/overview.json
      date_formats:
        default_timezone: Europe/Helsinki
        full_date: YYYY-MM-DD HH:mm:ss
        interval_hour: DD.MM HH:mm
        interval_day: DD.MM
      auth:
        oauth_auto_login: true
        signout_redirect_url: https://id.fruitiex.org/api/oidc/end-session
      auth.generic_oauth:
        enabled: true
        name: Pocket ID
        client_id: grafana
        scopes: openid profile email groups
        auth_url: https://id.fruitiex.org/authorize
        token_url: https://id.fruitiex.org/api/oidc/token
        api_url: https://id.fruitiex.org/api/oidc/userinfo
        use_pkce: true
        allow_sign_up: true
        login_attribute_path: preferred_username
        name_attribute_path: name
        email_attribute_path: email
        groups_attribute_path: groups
        allowed_groups: admins
        role_attribute_path: contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'
        allow_assign_grafana_admin: true
    persistence:
      type: pvc
      enabled: true
      storageClassName: nfs-csi
      accessModes:
        - ReadWriteOnce
      size: 10Gi
    sidecar:
      # Shared by all four sidecar containers.
      resources:
        requests:
          memory: 64Mi
      alerts:
        enabled: true
        searchNamespace: ALL
      dashboards:
        enabled: true
        searchNamespace: ALL
        # Dashboards land in the folder named by their grafana_folder
        # annotation (Home, Homelab, Kubernetes, Loki, Legacy); the overview has none
        # and sits at the top level as the home dashboard.
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
      notifiers:
        enabled: true
        searchNamespace: ALL
