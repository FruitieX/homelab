# Application metrics endpoints.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: bambuddy
  namespace: default
spec:
  selector:
    matchLabels:
      app: bambuddy
  podMetricsEndpoints:
    - port: http
      path: /api/v1/metrics
      interval: 60s
---
# CloudNativePG instances of the shared PostgreSQL (apps/postgres/postgres-ha.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-ha
  namespace: default
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-ha
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
