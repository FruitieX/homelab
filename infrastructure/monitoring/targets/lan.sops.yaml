apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
    name: nas-snmp
    namespace: kube-prometheus-stack
spec:
    scrapeInterval: 2m
    scrapeTimeout: 90s
    metricsPath: /snmp
    params:
        module:
            - synology
            - if_mib
            - ucd_system_stats
            - ucd_memory
            - ucd_la_table
            - system
        auth:
            - nectarine
    staticConfigs:
        - labels:
            host: nectarine
          targets:
            - ENC[AES256_GCM,data:Y7aLNWaYdWRbUbGV,iv:xxdGPRPtpvmsMYeMbc2hz74tEn+8V3YMPCrOgA6p7wE=,tag:FbdxTiJy6dWLWtEl7khnuQ==,type:str]
    relabelings:
        - targetLabel: job
          replacement: nas-snmp
    # diskID arrives hex-encoded (OctetString without a display hint).
    metricRelabelings:
        - sourceLabels:
            - diskID
          regex: "0x4469736B2031"
          targetLabel: diskID
          replacement: Disk 1
        - sourceLabels:
            - diskID
          regex: "0x4469736B2032"
          targetLabel: diskID
          replacement: Disk 2
        - sourceLabels:
            - diskID
          regex: "0x4469736B2033"
          targetLabel: diskID
          replacement: Disk 3
        - sourceLabels:
            - diskID
          regex: "0x4469736B2034"
          targetLabel: diskID
          replacement: Disk 4
        - sourceLabels:
            - diskID
          regex: 0x4D2E322044726976652031
          targetLabel: diskID
          replacement: M.2 Drive 1
        - sourceLabels:
            - __address__
          targetLabel: __param_target
        - sourceLabels:
            - host
          targetLabel: instance
        - targetLabel: __address__
          replacement: snmp-exporter.kube-prometheus-stack.svc:9116
