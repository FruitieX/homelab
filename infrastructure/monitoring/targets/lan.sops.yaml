apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
    name: nas-snmp
    namespace: kube-prometheus-stack
spec:
    scrapeInterval: 2m
    scrapeTimeout: 90s
    metricsPath: /snmp
    params:
        module:
            - synology
            - if_mib
            - ucd_system_stats
            - ucd_memory
            - ucd_la_table
            - system
        auth:
            - nectarine
    staticConfigs:
        - labels:
            host: nectarine
          targets:
            - ENC[AES256_GCM,data:Uw3Kb5lV3bI0HsHK,iv:bND6POgXu1j1XNGU93DwqzC8fdzy8v7PmE7reavDG0w=,tag:4wT1JCYX8V0xqa5zuarWoA==,type:str]
    relabelings:
        - targetLabel: job
          replacement: nas-snmp
        - sourceLabels:
            - __address__
          targetLabel: __param_target
        - sourceLabels:
            - host
          targetLabel: instance
        - targetLabel: __address__
          replacement: snmp-exporter.kube-prometheus-stack.svc:9116
    # diskID arrives hex-encoded (OctetString without a display hint).
    metricRelabelings:
        - sourceLabels:
            - diskID
          regex: "0x4469736B2031"
          targetLabel: diskID
          replacement: Disk 1
        - sourceLabels:
            - diskID
          regex: "0x4469736B2032"
          targetLabel: diskID
          replacement: Disk 2
        - sourceLabels:
            - diskID
          regex: "0x4469736B2033"
          targetLabel: diskID
          replacement: Disk 3
        - sourceLabels:
            - diskID
          regex: "0x4469736B2034"
          targetLabel: diskID
          replacement: Disk 4
        - sourceLabels:
            - diskID
          regex: 0x4D2E322044726976652031
          targetLabel: diskID
          replacement: M.2 Drive 1
