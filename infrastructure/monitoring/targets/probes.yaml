# Reachability, latency and TLS expiry of every public/private app hostname.
# LAN host probes (NAS, Proxmox, gateway) are in lan.sops.yaml.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: apps-public
  namespace: kube-prometheus-stack
spec:
  interval: 60s
  module: http_up
  prober:
    url: blackbox-exporter.kube-prometheus-stack.svc:9115
  targets:
    staticConfig:
      labels:
        gateway: public
      static:
        - https://busmap.fruitiex.org
        - https://fruitiex.org
        - https://id.fruitiex.org
        - https://lovegren.fi
        - https://oriel.fruitiex.org/healthz
        - https://rsfinity.fruitiex.org
        - https://spliit.fruitiex.org
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: apps-private
  namespace: kube-prometheus-stack
spec:
  interval: 60s
  module: http_up
  prober:
    url: blackbox-exporter.kube-prometheus-stack.svc:9115
  targets:
    staticConfig:
      labels:
        gateway: private
      static:
        - https://alertmanager.fruitiex.org
        - https://bambuddy.fruitiex.org
        - https://chores.fruitiex.org
        - https://drive.fruitiex.org
        - https://feedback.fruitiex.org
        - https://ferrotune.fruitiex.org
        - https://grafana.fruitiex.org
        - https://homectl.fruitiex.org
        - https://immich.fruitiex.org
        - https://influxdb.fruitiex.org
        - https://jellyfin.fruitiex.org
        - https://kubedash.fruitiex.org
        - https://littlecupboard.fruitiex.org
        - https://littlewardrobe.fruitiex.org
        - https://llm-wiki.fruitiex.org
        - https://nectarine.fruitiex.org
        - https://photoframe.fruitiex.org
        - https://photos.fruitiex.org
        - https://prometheus.fruitiex.org
        - https://radiator.fruitiex.org
        - https://redoor.fruitiex.org
        - https://steady.fruitiex.org
        - https://stretch.fruitiex.org
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: cluster-services
  namespace: kube-prometheus-stack
spec:
  interval: 60s
  module: tcp_connect
  prober:
    url: blackbox-exporter.kube-prometheus-stack.svc:9115
  targets:
    staticConfig:
      labels:
        kind: service
      static:
        - mqtt.default.svc:1883
        - postgres.default.svc:5432
        - immich-postgres.default.svc:5432
        - influxdb-influxdb2.influxdb.svc:80
        - loki.loki.svc:3100
---
# The internet as the cluster sees it: latency to public resolvers and
# reachability of the services the homelab depends on. GitHub SSH on port 22
# is probed next to port 443 because port 22 was found to time out often.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: internet-ping
  namespace: kube-prometheus-stack
spec:
  interval: 30s
  module: icmp
  prober:
    url: blackbox-exporter.kube-prometheus-stack.svc:9115
  targets:
    staticConfig:
      labels:
        group: internet
      static:
        - 1.1.1.1
        - 8.8.8.8
        - 9.9.9.9
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: internet-ssh
  namespace: kube-prometheus-stack
spec:
  interval: 60s
  module: ssh_banner
  prober:
    url: blackbox-exporter.kube-prometheus-stack.svc:9115
  targets:
    staticConfig:
      labels:
        group: internet
      static:
        - github.com:22
        - ssh.github.com:443
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: internet-tcp
  namespace: kube-prometheus-stack
spec:
  interval: 60s
  module: tcp_connect
  prober:
    url: blackbox-exporter.kube-prometheus-stack.svc:9115
  targets:
    staticConfig:
      labels:
        group: internet
      static:
        - github.com:443
        - ghcr.io:443
        - api.myuplink.com:443
        - opendata.fmi.fi:443
        - discord.com:443
