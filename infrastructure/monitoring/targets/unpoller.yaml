# UniFi Poller: gateway/switch/AP/client metrics from the UniFi Network
# integration API (API key + controller URL in unpoller.sops.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  namespace: kube-prometheus-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unpoller
  template:
    metadata:
      labels:
        app: unpoller
      annotations:
        secret.reloader.stakater.com/reload: unpoller
    spec:
      containers:
        - name: unpoller
          image: ghcr.io/unpoller/unpoller:v5.8.3@sha256:6a474f5202d40864affe6be9882492061331d77d474593bb1cd4a8c737dc834f
          envFrom:
            - secretRef:
                name: unpoller
          env:
            - name: UP_INFLUXDB_DISABLE
              value: "true"
            - name: UP_PROMETHEUS_HTTP_LISTEN
              value: "0.0.0.0:9130"
            - name: UP_UNIFI_DEFAULT_VERIFY_SSL
              value: "false"
            - name: UP_UNIFI_DEFAULT_SAVE_SITES
              value: "true"
            - name: UP_UNIFI_DEFAULT_SAVE_DPI
              value: "false"
            - name: UP_UNIFI_DEFAULT_SAVE_EVENTS
              value: "false"
            - name: UP_UNIFI_DEFAULT_SAVE_ALARMS
              value: "false"
            - name: UP_UNIFI_DEFAULT_SAVE_IDS
              value: "false"
          ports:
            - name: metrics
              containerPort: 9130
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: unpoller
  namespace: kube-prometheus-stack
  labels:
    app: unpoller
spec:
  selector:
    app: unpoller
  ports:
    - name: metrics
      port: 9130
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unpoller
  namespace: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: unpoller
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
