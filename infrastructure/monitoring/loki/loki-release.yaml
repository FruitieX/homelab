apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: loki
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    deploymentMode: SingleBinary
    # loki-sc-rules sidecar: loads ConfigMaps labelled loki_rule (e.g.
    # security-rules.yaml) for the ruler. With auth disabled the tenant is
    # "fake", hence the folder.
    sidecar:
      resources:
        requests:
          memory: 64Mi
      rules:
        folder: /rules/fake
    singleBinary:
      replicas: 1
      resources:
        requests:
          memory: 384Mi
      persistence:
        enabled: true
        size: 50Gi
        storageClass: nfs-csi

    # Zero out replica counts of other deployment modes
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0

    # Loki configuration
    loki:
      commonConfig:
        replication_factor: 1
      auth_enabled: false
      storage:
        type: filesystem
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
          admin: loki-admin
      storage_config:
        boltdb_shipper:
          active_index_directory: /var/loki/index
          cache_location: /var/loki/cache
        filesystem:
          directory: /var/loki/chunks
      pattern_ingester:
        enabled: true
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: boltdb-shipper
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      rulerConfig:
        wal:
          dir: /var/loki/ruler-wal
        storage:
          type: local
          local:
            directory: /rules
        rule_path: /var/loki/rules-temp
        alertmanager_url: http://kube-prometheus-stack-alertmanager.kube-prometheus-stack.svc:9093
        enable_api: true
      compactor:
        retention_enabled: true
        # Required when retention is enabled; use filesystem since object_store is filesystem
        delete_request_store: filesystem
      limits_config:
        retention_period: 90d
        # Structured metadata requires TSDB index; disable for boltdb-shipper schema
        allow_structured_metadata: false
    monitoring:
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Loki
      rules:
        enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack

    # The memcached caches reserved ~1.4 GiB while using ~35 MiB; a single
    # Loki with this little log volume doesn't benefit from them.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
