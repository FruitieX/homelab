# Retention for the boltdb-shipper period; see boltdb-sweep.py. Delete this,
# the script and the boltdb_shipper/schema entries once the last boltdb table
# (2026-10-30) has expired, early February 2027.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loki-boltdb-sweep
spec:
  schedule: "37 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # Same node as Loki: the volume is ReadWriteOnce.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: loki
                      app.kubernetes.io/component: single-binary
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sweep
              image: docker.io/library/python:3.15.2-alpine3.24@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
              command: [python3, -u, /scripts/boltdb-sweep.py]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: storage, mountPath: /var/loki}
                - {name: scripts, mountPath: /scripts}
          volumes:
            - name: storage
              persistentVolumeClaim:
                claimName: storage-loki-0
            - name: scripts
              configMap:
                name: loki-boltdb-sweep
