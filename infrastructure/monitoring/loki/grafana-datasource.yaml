apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: loki
  labels:
    grafana_datasource: "1"
data:
  # Unique file name: kube-prometheus-stack's datasource ConfigMap already
  # uses datasource.yaml, and the Grafana sidecar writes both to one folder.
  loki-datasource.yaml: |-
    apiVersion: 1
    # The UI-era Loki datasource had a random uid, which made every
    # provisioning reload fail; recreate it with the stable uid "loki".
    deleteDatasources:
      - name: Loki
        orgId: 1
    datasources:
    - name: "Loki"
      type: loki
      uid: loki
      url: http://loki.loki.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        timeout: 60
        maxLines: 1000
