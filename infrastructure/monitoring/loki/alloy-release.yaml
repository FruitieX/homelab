# Grafana Alloy ships pod logs to Loki (replaced Promtail, which is EOL).
# The pipeline reproduces Promtail's kubernetes-pods job label for label
# (app, instance, component, node_name, namespace, job, pod, container,
# filename, stream), because Loki rules and dashboards select on them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: loki
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: alloy
      version: "1.14.3"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    crds:
      create: false
    controller:
      type: daemonset
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      volumes:
        extra:
          - name: pods
            hostPath:
              path: /var/log/pods
          # Positions survive pod restarts, so files are not re-read.
          - name: storage
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate
          - name: tmp
            emptyDir: {}
    alloy:
      enableReporting: false
      storagePath: /var/lib/alloy
      mounts:
        extra:
          - name: pods
            mountPath: /var/log/pods
            readOnly: true
          - name: storage
            mountPath: /var/lib/alloy
          - name: tmp
            mountPath: /tmp
      securityContext:
        # Pod log files are root-owned; root needs no capabilities to read them.
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 20m
          memory: 96Mi
        limits:
          memory: 512Mi
      configMap:
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
            }
          }

          // Same relabeling as the Promtail chart's kubernetes-pods job.
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_controller_name"]
              regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
              target_label  = "__tmp_controller_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__tmp_controller_name", "__meta_kubernetes_pod_name"]
              regex         = "^;*([^;]+)(;.*)?$"
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_instance"]
              regex         = "^;*([^;]+)(;.*)?$"
              target_label  = "instance"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
              regex         = "^;*([^;]+)(;.*)?$"
              target_label  = "component"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["namespace", "app"]
              separator     = "/"
              target_label  = "job"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash", "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              regex         = "true/(.*)"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
          }

          loki.source.file "pods" {
            targets       = discovery.relabel.pods.output
            forward_to    = [loki.process.pods.receiver]
            file_match {
              enabled = true
            }
          }

          // Decodes the CRI wrapper and sets the stream label, like Promtail's cri stage.
          loki.process "pods" {
            forward_to = [loki.write.default.receiver]
            stage.cri { }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
            }
          }
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
