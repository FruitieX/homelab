apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: influxdb
  namespace: influxdb
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: influxdb2
      version: "2.1.2"
      sourceRef:
        kind: HelmRepository
        name: influxdata
        namespace: flux-system
  values:
    # A minAvailable 1 budget on a single replica blocks every node drain,
    # including tuppr's unattended upgrades; accept the restart instead.
    pdb:
      create: false
    resources:
      requests:
        # Process memory (RSS) peaked at ~1.5 GiB over a week; the working
        # set reaches several GiB only through reclaimable file cache of the
        # TSM files. The write cache is capped at 1 GiB by default.
        memory: 1536Mi
    adminUser:
      existingSecret: influxdb-auth
    persistence:
      enabled: true
      storageClass: nfs-csi
      size: 100Gi
    ingress:
      enabled: false
