apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: influxdb
resources:
  - influxdb-auth.yaml
  - namespace.yaml
  - release.yaml
  - httproute.yaml
  - pocket-id-auth.yaml
  - compaction.yaml
configMapGenerator:
  - name: influxdb-compaction-scripts
    files:
      - compaction/compact.sh
      - compaction/compact-window.flux
    options:
      annotations:
        # The scripts use ${...} shell variables of their own.
        kustomize.toolkit.fluxcd.io/substitute: disabled
