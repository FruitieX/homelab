name: Deployment notifier checks

on:
  push:
    paths:
      - infrastructure/flux/notification-provider/**
      - clusters/homelab/apps/**
      - apps/homectl/deployment.yaml
      - default.nix
      - .github/workflows/deployment-notifier.yaml
  pull_request:
    paths:
      - infrastructure/flux/notification-provider/**
      - clusters/homelab/apps/**
      - apps/homectl/deployment.yaml
      - default.nix
      - .github/workflows/deployment-notifier.yaml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: azure/setup-kubectl@v5
      - run: python -m pip install PyYAML==6.0.2
      - run: python -B -m unittest discover -s infrastructure/flux/notification-provider/deployment-notifier -v
