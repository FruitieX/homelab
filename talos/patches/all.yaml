# Every node reaches the API through KubePrism (a local load balancer on
# 127.0.0.1:7445 across all API servers). kube-proxy and flannel use it too,
# so losing one control plane doesn't freeze Service routing, as it did on
# 2026-10-26 when everything pointed at a single control-plane address.
machine:
  features:
    kubePrism:
      enabled: true
      port: 7445
  # Containerd fetches through the NAS without changing workload image names.
  # Keep upstream fallback for availability when the NAS registry is unavailable.
  registries:
    mirrors:
      docker.io:
        endpoints:
          - https://nectarine.internal.fruitiex.org:5050/v2/dockerhub
        overridePath: true
      ghcr.io:
        endpoints:
          - https://nectarine.internal.fruitiex.org:5050/v2/ghcr
        overridePath: true
      quay.io:
        endpoints:
          - https://nectarine.internal.fruitiex.org:5050/v2/quay
        overridePath: true
      registry.k8s.io:
        endpoints:
          - https://nectarine.internal.fruitiex.org:5050/v2/k8s
        overridePath: true
      factory.talos.dev:
        endpoints:
          - https://nectarine.internal.fruitiex.org:5050/v2/factory
        overridePath: true
    config:
      nectarine.internal.fruitiex.org:5050:
        tls:
          # Public CA from nas/zot/ca.crt; credentials are in registries.sops.yaml.
          ca: 
