# App registry for feedback-hub: tells agents where each app's code lives.
# `checkout` is the path on the agent machine (worker default: ~/<id>).

[[apps]]
id = "ferrotune"
name = "Ferrotune (web)"
repo = "git@github.com:FruitieX/ferrotune.git"
checkout = "~/projects/ferrotune"
hosts = ["ferrotune.fruitiex.org"]
notes = "Rust server in src/, Vite/React web client in client/."

[[apps]]
id = "ferrotune-android"
name = "Ferrotune (Android)"
repo = "git@github.com:FruitieX/ferrotune.git"
checkout = "~/projects/ferrotune"
notes = "Native Kotlin/Jetpack Compose app in android/. Feedback comes from the in-app feedback screen."

