# Injects the feedback-hub widget into HTML pages of these routes, for LAN/VPN
# clients only (see widget-injection.lua). To opt an app in, add a policy here
# and an entry to apps.toml. A route can only have one EnvoyExtensionPolicy.
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: feedback-widget-ferrotune
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ferrotune
  lua:
    - type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: feedback-widget-lua
      filterContext:
        app: ferrotune
        hub: https://feedback.fruitiex.org
---
