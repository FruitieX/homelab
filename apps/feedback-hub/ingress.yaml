apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: feedback-hub
spec:
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - feedback.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: feedback-hub
          port: 8080
      timeouts:
        # The triage UI's change stream (/api/changes) is long-lived.
        request: 0s
