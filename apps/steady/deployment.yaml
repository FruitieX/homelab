apiVersion: apps/v1
kind: Deployment
metadata:
  name: steady
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: steady
  template:
    metadata:
      labels:
        app: steady
    spec:
      priorityClassName: homelab-apps
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: steady
          image: ghcr.io/fruitiex/steady:4aa072fc7c307e18622c4f70279e1864428179f9@sha256:84c925d9f47354bcd2d42e3ca2290443ac85e3a9d3e47d63899cee2e3b68ee1b
          imagePullPolicy: Always
          env:
            - name: STEADY_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: RUST_LOG
              value: steady_api=info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: steady-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
