apiVersion: apps/v1
kind: Deployment
metadata:
  name: steady
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: steady
  template:
    metadata:
      labels:
        app: steady
    spec:
      priorityClassName: homelab-apps
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: steady
          image: ghcr.io/fruitiex/steady:0a9c63a4fadc964826813c1ed3bf3e4a7183890c@sha256:dedde9732b619f8ee12a6e93445b3d74a21e01d07f98fad2f23544c0833fa5b9
          imagePullPolicy: Always
          env:
            - name: STEADY_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: RUST_LOG
              value: steady_api=info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: steady-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
