apiVersion: apps/v1
kind: Deployment
metadata:
  name: steady
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: steady
  template:
    metadata:
      labels:
        app: steady
    spec:
      priorityClassName: homelab-apps
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: steady
          image: ghcr.io/fruitiex/steady:4a581866d32d3c907d288fa25720a74b0751abe4@sha256:2b7971a69a7ed1940f38ac5af40db3ba7412f4f872ee5c5496a4997ab0460e4a
          imagePullPolicy: Always
          env:
            - name: STEADY_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: RUST_LOG
              value: steady_api=info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: steady-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
