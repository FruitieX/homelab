apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: steady
spec:
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - steady.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: steady
          port: 8080
