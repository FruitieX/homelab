apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: twinkly
spec:
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - twinkly.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: twinkly
          port: 8080
