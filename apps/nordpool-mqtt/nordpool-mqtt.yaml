apiVersion: apps/v1
kind: Deployment
metadata:
  name: nordpool-mqtt
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "nordpool-mqtt-config"
spec:
  selector:
    matchLabels:
      app: nordpool-mqtt
  template:
    metadata:
      labels:
        app: nordpool-mqtt
    spec:
      priorityClassName: homelab-home
      volumes:
        - name: nordpool-mqtt-config
          secret:
            secretName: nordpool-mqtt-config

      containers:
        - name: nordpool-mqtt
          image: ghcr.io/fruitiex/nordpool-mqtt:main@sha256:b3325394c777d636b6feeb3e674a2ecba07204dfd389cbeb5f68379bd1bc4c35
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
              cpu: 100m
          workingDir: /app
          volumeMounts:
            - mountPath: /app
              name: nordpool-mqtt-config

      initContainers:
        - name: wait-for-mqtt-broker
          image: busybox
          command:
            [
              "sh",
              "-c",
              "until nc -z mqtt 1883; do echo waiting for mqtt broker; sleep 1; done",
            ]
