apiVersion: apps/v1
kind: Deployment
metadata:
  name: nordpool-mqtt
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "nordpool-mqtt-config"
spec:
  selector:
    matchLabels:
      app: nordpool-mqtt
  template:
    metadata:
      labels:
        app: nordpool-mqtt
    spec:
      priorityClassName: homelab-home
      volumes:
        - name: nordpool-mqtt-config
          secret:
            secretName: nordpool-mqtt-config

      containers:
        - name: nordpool-mqtt
          image: ghcr.io/fruitiex/nordpool-mqtt:main@sha256:24f9ebb3d18968a47508e87e35b645c99ed0ba5aa1d62965bd457951d2a98077
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
              cpu: 100m
          workingDir: /app
          volumeMounts:
            - mountPath: /app
              name: nordpool-mqtt-config

      initContainers:
        - name: wait-for-mqtt-broker
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            [
              "sh",
              "-c",
              "until nc -z mqtt 1883; do echo waiting for mqtt broker; sleep 1; done",
            ]
