apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf-home
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "telegraf-home-config"
spec:
  selector:
    matchLabels:
      app: telegraf-home
  template:
    metadata:
      labels:
        app: telegraf-home
    spec:
      priorityClassName: homelab-home
      volumes:
        - name: telegraf-home-config
          secret:
            secretName: telegraf-home-config

      containers:
        - name: telegraf
          image: telegraf:1.40.3@sha256:2958e3cbdc22d702ebd4a1e2db004c564f52a866551a65817eea26011407ea66
          env:
            # For the tsdb (TimescaleDB) output, see config.yaml.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tsdb-app
                  key: password
          resources:
            requests:
              memory: 48Mi
            limits:
              # Includes the tsdb output's buffer (50 000 metrics).
              memory: 400Mi
              cpu: 100m
          workingDir: /etc/telegraf
          volumeMounts:
            - mountPath: /etc/telegraf
              name: telegraf-home-config