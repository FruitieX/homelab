apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoframe-rs
  namespace: default
spec:
  selector:
    matchLabels:
      app: photoframe-rs
  template:
    metadata:
      labels:
        app: photoframe-rs
    spec:
      priorityClassName: homelab-apps
      volumes:
        - name: photoframe-rs-config
          persistentVolumeClaim:
            claimName: photoframe-rs-config
      containers:
        - name: photoframe-rs
          image: ghcr.io/fruitiex/photoframe-rs-server:main@sha256:c614561d4f4b8709db84f313f84ac9fe9a56f154e1472619f55c5a73f37343b2
          resources:
            requests:
              memory: 80Mi
            limits:
              memory: 512Mi
              cpu: 1000m
          env:
            - name: TZ
              value: Europe/Helsinki
          ports:
            - name: http
              containerPort: 8080
          workingDir: /app
          volumeMounts:
            - mountPath: /app
              name: photoframe-rs-config