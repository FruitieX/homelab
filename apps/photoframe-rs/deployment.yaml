apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoframe-rs
  namespace: default
spec:
  selector:
    matchLabels:
      app: photoframe-rs
  template:
    metadata:
      labels:
        app: photoframe-rs
    spec:
      priorityClassName: homelab-apps
      volumes:
        - name: photoframe-rs-config
          persistentVolumeClaim:
            claimName: photoframe-rs-config
      containers:
        - name: photoframe-rs
          image: ghcr.io/fruitiex/photoframe-rs-server:main@sha256:21778ec6a04fd269a64e4f2f01c4fa48c1371bc752de87808e2d0075f1b0b5e6
          resources:
            requests:
              memory: 80Mi
            limits:
              memory: 512Mi
              cpu: 1000m
          env:
            - name: TZ
              value: Europe/Helsinki
          ports:
            - name: http
              containerPort: 8080
          workingDir: /app
          volumeMounts:
            - mountPath: /app
              name: photoframe-rs-config