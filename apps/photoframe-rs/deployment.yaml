apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoframe-rs
  namespace: default
spec:
  selector:
    matchLabels:
      app: photoframe-rs
  template:
    metadata:
      labels:
        app: photoframe-rs
    spec:
      priorityClassName: homelab-apps
      volumes:
        - name: photoframe-rs-config
          persistentVolumeClaim:
            claimName: photoframe-rs-config
      containers:
        - name: photoframe-rs
          image: ghcr.io/fruitiex/photoframe-rs-server:main@sha256:04c1806ec95d0d090d0e28a5e480799b99cb16d3fdf2a3f1c38a3a07366f600b
          resources:
            requests:
              memory: 80Mi
            limits:
              memory: 512Mi
              cpu: 1000m
          env:
            - name: TZ
              value: Europe/Helsinki
          ports:
            - name: http
              containerPort: 8080
          workingDir: /app
          volumeMounts:
            - mountPath: /app
              name: photoframe-rs-config