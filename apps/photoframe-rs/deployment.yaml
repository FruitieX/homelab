apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoframe-rs
  namespace: default
spec:
  selector:
    matchLabels:
      app: photoframe-rs
  template:
    metadata:
      labels:
        app: photoframe-rs
    spec:
      priorityClassName: homelab-apps
      volumes:
        - name: photoframe-rs-config
          persistentVolumeClaim:
            claimName: photoframe-rs-config
      containers:
        - name: photoframe-rs
          image: ghcr.io/fruitiex/photoframe-rs-server:main@sha256:7054a7ec5e9322aa9a50f58894c34833b4a8462187d45ba6b9e2480e12cd7459
          resources:
            requests:
              memory: 80Mi
            limits:
              memory: 512Mi
              cpu: 1000m
          env:
            - name: TZ
              value: Europe/Helsinki
          workingDir: /app
          volumeMounts:
            - mountPath: /app
              name: photoframe-rs-config