apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoframe-rs
  namespace: default
spec:
  selector:
    matchLabels:
      app: photoframe-rs
  template:
    metadata:
      labels:
        app: photoframe-rs
    spec:
      priorityClassName: homelab-apps
      volumes:
        - name: photoframe-rs-config
          persistentVolumeClaim:
            claimName: photoframe-rs-config
      containers:
        - name: photoframe-rs
          image: ghcr.io/fruitiex/photoframe-rs-server:main@sha256:bda878c136d9b37b1c87047b95b60cf981c41b0a7ecb7c0538801164e20f25b2
          resources:
            requests:
              memory: 80Mi
            limits:
              memory: 512Mi
              cpu: 1000m
          env:
            - name: TZ
              value: Europe/Helsinki
          ports:
            - name: http
              containerPort: 8080
          workingDir: /app
          volumeMounts:
            - mountPath: /app
              name: photoframe-rs-config