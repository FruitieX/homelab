apiVersion: apps/v1
kind: Deployment
metadata:
  name: littlewardrobe
  annotations:
    secret.reloader.stakater.com/reload: littlewardrobe-server-env
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: littlewardrobe
  template:
    metadata:
      labels:
        app: littlewardrobe
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: littlewardrobe
          image: ghcr.io/fruitiex/littlewardrobe:756b262359e344cbeb52757ca4d7f492ce1b53ef@sha256:5f0460674bae51c2d20e1301decbbcdaf4ba66d0a2128c01a1f5374076bd296e
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: littlewardrobe-server-env
          env:
            - name: LITTLEWARDROBE_ORIGIN
              value: https://littlewardrobe.fruitiex.org
            - name: LITTLEWARDROBE_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: RUST_LOG
              value: littlewardrobe_api=info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: littlewardrobe-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
