apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forkbasket
spec:
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - forkbasket.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: forkbasket
          port: 8080
      timeouts:
        request: 0s
