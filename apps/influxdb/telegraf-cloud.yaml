# Cloud data sources written to InfluxDB (bucket home), see docs/monitoring.md:
# - NIBE F750 heat pump via the myUplink API, once a minute (measurement nibe).
# - FMI open data: weather observations from the nearest station every 10 min
#   (fmi_observation), daily mean temperatures (fmi_daily) and the forecast
#   for home hourly (fmi_forecast).
# - Fingrid open data every 3 min: CO2 intensity, national production and
#   consumption, grid frequency and system state (fingrid).
# - The Verisure alarm state from verisure-bridge over MQTT (verisure).
# API keys, NIBE device id, station and home coordinates are in
# telegraf-cloud.sops.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-cloud-config
  namespace: default
  annotations:
    # Telegraf expands the ${...} variables itself.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  telegraf.conf: |
    [agent]
      interval = "60s"
      round_interval = true
      omit_hostname = true

    # NIBE F750 via the myUplink cloud API. The app only ever gets a READSYSTEM
    # token, so this poller cannot change any pump setting.
    [[inputs.http]]
      urls = ["https://api.myuplink.com/v2/devices/${NIBE_DEVICE_ID}/points"]
      token_url = "https://api.myuplink.com/oauth/token"
      client_id = "${NIBE_CLIENT_ID}"
      client_secret = "${NIBE_CLIENT_SECRET}"
      scopes = ["READSYSTEM"]
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [[inputs.http.json_v2]]
        measurement_name = "nibe"
        [[inputs.http.json_v2.object]]
          path = "@this"
          disable_prepend_keys = true
          included_keys = ["parameterId", "parameterName", "parameterUnit", "value"]
          tags = ["parameterId", "parameterName", "parameterUnit"]

    # 65535 is a placeholder point with no data.
    [inputs.http.tagdrop]
      parameterId = ["65535"]

    # FMI open data (no key). The simple format has one element per value.
    [[inputs.http]]
      interval = "10m"
      urls = ["https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=getFeature&storedquery_id=fmi::observations::weather::simple&fmisid=${FMI_STATION}&timestep=10"]
      timeout = "30s"
      tagexclude = ["url"]
      data_format = "xml"
      [[inputs.http.xpath]]
        metric_name = "'fmi_observation'"
        metric_selection = "//BsWfs:BsWfsElement[BsWfs:ParameterValue != 'NaN']"
        timestamp = "BsWfs:Time"
        timestamp_format = "2006-01-02T15:04:05Z"
        [inputs.http.xpath.tags]
          param = "BsWfs:ParameterName"
        [inputs.http.xpath.fields]
          value = "number(BsWfs:ParameterValue)"

    # Daily mean temperature (tday), which FMI computes the morning after; the
    # last few days are returned, so a missed fetch fills itself in.
    [[inputs.http]]
      interval = "6h"
      urls = ["https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=getFeature&storedquery_id=fmi::observations::weather::daily::simple&fmisid=${FMI_STATION}&parameters=tday"]
      timeout = "30s"
      tagexclude = ["url"]
      data_format = "xml"
      [[inputs.http.xpath]]
        metric_name = "'fmi_daily'"
        metric_selection = "//BsWfs:BsWfsElement[BsWfs:ParameterValue != 'NaN']"
        timestamp = "BsWfs:Time"
        timestamp_format = "2006-01-02T15:04:05Z"
        [inputs.http.xpath.tags]
          param = "BsWfs:ParameterName"
        [inputs.http.xpath.fields]
          value = "number(BsWfs:ParameterValue)"

    # The forecast is rewritten every hour, so future points always hold the
    # latest forecast.
    [[inputs.http]]
      interval = "1h"
      urls = ["https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=getFeature&storedquery_id=fmi::forecast::edited::weather::scandinavia::point::simple&latlon=${HOME_LATLON}&timestep=60&parameters=Temperature,WindSpeedMS,WindGust,Precipitation1h,TotalCloudCover,Humidity,DewPoint,RadiationGlobal"]
      timeout = "30s"
      tagexclude = ["url"]
      data_format = "xml"
      [[inputs.http.xpath]]
        metric_name = "'fmi_forecast'"
        metric_selection = "//BsWfs:BsWfsElement[BsWfs:ParameterValue != 'NaN']"
        timestamp = "BsWfs:Time"
        timestamp_format = "2006-01-02T15:04:05Z"
        [inputs.http.xpath.tags]
          param = "BsWfs:ParameterName"
        [inputs.http.xpath.fields]
          value = "number(BsWfs:ParameterValue)"

    # Fingrid open data: the latest 3-minute value of each dataset (measurement
    # fingrid, tag series). The API allows one request per 2 s and 10 000 a
    # day, so the inputs are staggered 10 s apart: 11 requests per 3 minutes.
    [[inputs.http]]
      interval = "3m"
      collection_offset = "0s"
      urls = ["https://data.fingrid.fi/api/datasets/265/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "co2_consumption"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    [[inputs.http]]
      interval = "3m"
      collection_offset = "10s"
      urls = ["https://data.fingrid.fi/api/datasets/266/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "co2_production"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    [[inputs.http]]
      interval = "3m"
      collection_offset = "20s"
      urls = ["https://data.fingrid.fi/api/datasets/193/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "consumption"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    [[inputs.http]]
      interval = "3m"
      collection_offset = "30s"
      urls = ["https://data.fingrid.fi/api/datasets/192/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "production"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    [[inputs.http]]
      interval = "3m"
      collection_offset = "40s"
      urls = ["https://data.fingrid.fi/api/datasets/194/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "net_import"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    [[inputs.http]]
      interval = "3m"
      collection_offset = "50s"
      urls = ["https://data.fingrid.fi/api/datasets/181/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "wind"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    [[inputs.http]]
      interval = "3m"
      collection_offset = "60s"
      urls = ["https://data.fingrid.fi/api/datasets/188/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "nuclear"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    [[inputs.http]]
      interval = "3m"
      collection_offset = "70s"
      urls = ["https://data.fingrid.fi/api/datasets/191/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "hydro"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    [[inputs.http]]
      interval = "3m"
      collection_offset = "80s"
      urls = ["https://data.fingrid.fi/api/datasets/177/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "frequency"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    [[inputs.http]]
      interval = "3m"
      collection_offset = "90s"
      urls = ["https://data.fingrid.fi/api/datasets/209/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "system_state"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    [[inputs.http]]
      interval = "3m"
      collection_offset = "100s"
      urls = ["https://data.fingrid.fi/api/datasets/336/data/latest"]
      headers = {"x-api-key" = "${FINGRID_API_KEY}"}
      timeout = "20s"
      tagexclude = ["url"]
      data_format = "json_v2"
      [inputs.http.tags]
        series = "shortage_status"
      [[inputs.http.json_v2]]
        measurement_name = "fingrid"
        timestamp_path = "startTime"
        timestamp_format = "2006-01-02T15:04:05.000Z"
        [[inputs.http.json_v2.field]]
          path = "value"
          type = "float"

    # Verisure alarm state from verisure-bridge (retained, so a restart picks up
    # the current state). Measurement verisure, tag topic, string field value.
    [[inputs.mqtt_consumer]]
      servers = ["tcp://mqtt:1883"]
      topics = ["home/verisure/state", "home/verisure/mode"]
      client_id = "telegraf-cloud-verisure"
      qos = 1
      data_format = "value"
      data_type = "string"
      name_override = "verisure"

    [[processors.rename]]
      namepass = ["nibe"]
      [[processors.rename.replace]]
        tag = "parameterId"
        dest = "id"
      [[processors.rename.replace]]
        tag = "parameterName"
        dest = "name"
      [[processors.rename.replace]]
        tag = "parameterUnit"
        dest = "unit"

    # myUplink names carry soft hyphens for line breaking.
    [[processors.strings]]
      namepass = ["nibe"]
      [[processors.strings.replace]]
        tag = "name"
        old = "­"
        new = ""

    [[outputs.influxdb_v2]]
      urls = ["http://influxdb-influxdb2.influxdb.svc"]
      token = "${INFLUX_TOKEN}"
      organization = "influxdata"
      bucket = "home"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf-cloud
  namespace: default
  annotations:
    configmap.reloader.stakater.com/reload: "telegraf-cloud-config"
    secret.reloader.stakater.com/reload: "telegraf-cloud"
spec:
  selector:
    matchLabels:
      app: telegraf-cloud
  template:
    metadata:
      labels:
        app: telegraf-cloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: telegraf-cloud-config
      containers:
        - name: telegraf
          image: telegraf:1.40.2-alpine@sha256:4a62bd294bf2f4c1e3781194fe7b625b7e527244eeb31afd5758227914a16229
          args: ["--config", "/etc/telegraf/telegraf.conf"]
          envFrom:
            - secretRef:
                name: telegraf-cloud
          resources:
            requests:
              memory: 40Mi
              cpu: 5m
            limits:
              memory: 150Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /etc/telegraf
              name: config
