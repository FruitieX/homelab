apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-wiki-web
spec:
  # Private gateway only: reachable over the LAN and VPN, never publicly.
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - llm-wiki.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: llm-wiki-web
          port: 8080
      timeouts:
        request: 0s
