apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id
  annotations:
    # Use the existing public wildcard DNS instead of publishing gateway LAN IPs.
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  # Public so apps on the public gateway (LittleCupboard, Immich, ...) can sign
  # in from outside the LAN; Pocket ID only accepts passkeys.
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - id.fruitiex.org
  rules:
    # Admin API calls with the static key (X-API-Key); admin-api-lan-only
    # below rejects them from outside the LAN, VPN and cluster.
    - name: admin-api
      matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: X-API-Key
              type: RegularExpression
              value: ".*"
      backendRefs:
        - name: pocket-id
          port: 1411
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pocket-id
          port: 1411
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: admin-api-lan-only
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: pocket-id
      sectionName: admin-api
  authorization:
    defaultAction: Deny
    rules:
      - name: lan-vpn-cluster
        action: Allow
        principal:
          # Envoy sees the TCP peer address (no X-Forwarded-For trust), so this
          # can't be spoofed. 192.168.0.0/16 covers the LAN, VLANs and VPN.
          clientCIDRs:
            - 192.168.0.0/16
            - 10.0.0.0/8
