# Nightly logical backup of tsdb to an NFS volume, which the NAS's Hyper
# Backup copies off (like postgres-dump for the shared PostgreSQL).
# tsdb-dump.sh keeps /dumps/latest as a pg_dump directory dump whose data files
# have stable names and only change when their table does, so old compressed
# chunks cost Hyper Backup nothing after the first night. Restore with
# latest/restore-dump.sh (a copy of restore-dump.sh), see its header.
# KEEP_DAYS dated pg_dump -Fc copies are kept as well; set it to "0" once Hyper
# Backup covers latest/.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tsdb-dumps
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tsdb-dump
  namespace: default
spec:
  schedule: "47 2 * * *"
  timeZone: Europe/Helsinki
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: OnFailure
          priorityClassName: homelab-batch
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              # Same image as the cluster, so pg_dump matches its version.
              image: ghcr.io/fruitiex/postgresql-timescaledb:18@sha256:fa6e5083bb3424f751235b2831ef792dc2a043263796a00735a7070fdbadc99f
              env:
                - name: PGHOST
                  value: tsdb-rw
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: tsdb-superuser
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tsdb-superuser
                      key: password
                - name: KEEP_DAYS
                  value: "3"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/bash", "/scripts/tsdb-dump.sh"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: tsdb-dumps
            - name: scripts
              configMap:
                name: tsdb-dump-scripts
