apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./tsdb-superuser.sops.yaml
  - ./tsdb-app.sops.yaml
  - ./tsdb-grafana-ro.sops.yaml
  - ./tsdb.yaml
  - ./tsdb-dump.yaml
# The Cluster refers to this ConfigMap by name, so no hash suffix.
configMapGenerator:
  - name: tsdb-schema
    namespace: default
    files:
      - bootstrap.sql
      - schema.sql
generatorOptions:
  disableNameSuffixHash: true
