apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/reload: glimmer-env
  name: glimmer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glimmer
  template:
    metadata:
      labels:
        app: glimmer
    spec:
      priorityClassName: homelab-home
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: glimmer
          image: ghcr.io/fruitiex/glimmer:3d3fdeb8cf267abcc0582b50cf5734cfd8385fa9@sha256:4aa8f2d3d31ae5fe422db23c72b226b0d176316d6e46a75d65e601f685f28156
          imagePullPolicy: Always
          env:
            - name: GLIMMER_ORIGIN
              value: https://glimmer.fruitiex.org
            - name: GLIMMER_FEEDBACK_HUB
              value: https://feedback.fruitiex.org
            - name: GLIMMER_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: RUST_LOG
              value: glimmer=info
            # Passkey sign-in through Pocket ID; the client secret is in glimmer-env.
            - name: GLIMMER_OIDC_ISSUER
              value: https://id.fruitiex.org
            - name: GLIMMER_OIDC_CLIENT_ID
              value: glimmer
            - name: GLIMMER_OIDC_ALLOWED_GROUPS
              value: family
            # Same topics and broker user as the old twinkly-mqtt bridge; credentials are in glimmer-env.
            - name: GLIMMER_MQTT_HOST
              value: mqtt
            - name: GLIMMER_MQTT_PORT
              value: "1883"
          envFrom:
            - secretRef:
                name: glimmer-env
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: glimmer-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
