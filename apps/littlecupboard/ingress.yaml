apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: littlecupboard
  annotations:
    # Use the existing public wildcard DNS instead of publishing gateway LAN IPs.
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - littlecupboard.fruitiex.org
    - forkbasket.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: littlecupboard
          port: 8080
      timeouts:
        request: 0s
