apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: littlecupboard
spec:
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - littlecupboard.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: littlecupboard
          port: 8080
      timeouts:
        request: 0s
