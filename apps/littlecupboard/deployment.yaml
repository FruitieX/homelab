apiVersion: apps/v1
kind: Deployment
metadata:
  name: littlecupboard
  annotations:
    secret.reloader.stakater.com/reload: forkbasket-server-env
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: littlecupboard
  template:
    metadata:
      labels:
        app: littlecupboard
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: littlecupboard
          image: ghcr.io/fruitiex/littlecupboard:9c77c6764069ed822277bca622d7aee589369c09@sha256:22f6fca4b86c552040ab7eb7d43e279e8816ebdb83747a9d5f1f168e12ff3682
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: forkbasket-server-env
          env:
            - name: LITTLECUPBOARD_ORIGIN
              value: https://littlecupboard.fruitiex.org
            - name: LITTLECUPBOARD_LEGACY_ORIGINS
              value: https://forkbasket.fruitiex.org
            - name: LITTLECUPBOARD_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: LITTLECUPBOARD_OIDC_ISSUER
              value: https://id.fruitiex.org
            - name: LITTLECUPBOARD_OIDC_CLIENT_ID
              value: littlecupboard
            - name: LITTLECUPBOARD_OIDC_ALLOWED_GROUPS
              value: family
            - name: RUST_LOG
              value: littlecupboard_api=info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forkbasket-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
