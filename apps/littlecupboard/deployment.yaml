apiVersion: apps/v1
kind: Deployment
metadata:
  name: littlecupboard
  annotations:
    secret.reloader.stakater.com/reload: littlecupboard-server-env
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: littlecupboard
  template:
    metadata:
      labels:
        app: littlecupboard
    spec:
      priorityClassName: homelab-apps
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: littlecupboard
          image: ghcr.io/fruitiex/littlecupboard:ff6581d647728d09ecfe638ecb3d862bca00b400@sha256:30f59e218f59e3bc35ce316d59d748e1eb4091bbb98f69dab9b529eb286388d0
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: littlecupboard-server-env
          env:
            - name: LITTLECUPBOARD_ORIGIN
              value: https://littlecupboard.fruitiex.org
            - name: LITTLECUPBOARD_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: LITTLECUPBOARD_OIDC_ISSUER
              value: https://id.fruitiex.org
            - name: LITTLECUPBOARD_OIDC_CLIENT_ID
              value: littlecupboard
            - name: LITTLECUPBOARD_OIDC_ALLOWED_GROUPS
              value: family
            - name: RUST_LOG
              value: littlecupboard_api=info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: littlecupboard-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
