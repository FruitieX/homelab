---
# PostgreSQL 14 data directory, no longer mounted since the upgrade to 18
# (2026-10-28). Kept for rollback: revert the upgrade commit and Immich runs on
# PostgreSQL 14 again with the data as of the upgrade. Delete this PVC (and its
# PV, reclaim policy Retain) together with immich-postgres-upgrade-dump once
# PostgreSQL 18 has run without problems for a few weeks.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Data directory for the PostgreSQL 18 cluster (see the Deployment below).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres18-data
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# pg_dumpall of the PostgreSQL 14 cluster taken right before the 14 -> 18
# upgrade (2026-10-28). Kept apart from /data/backups so Immich's backup
# rotation never deletes it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-upgrade-dump
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: default
spec:
  # Cluster-internal only: Immich is the only client.
  type: ClusterIP
  selector:
    app: immich-postgres
  ports:
    - name: psql
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      priorityClassName: homelab-apps
      containers:
        - name: immich-postgres
          image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.5
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 5432
          env:
            # The image refuses to start on NFS. The database has always lived
            # on nfs-csi (no block storage class in the cluster); accept that.
            - name: IGNORE_DATABASE_FSTYPE
              value: "true"
          envFrom:
            - secretRef:
                name: immich-postgres-config
          volumeMounts:
            # PostgreSQL 18 images keep PGDATA in /var/lib/postgresql/18/docker.
            - mountPath: /var/lib/postgresql
              name: immich-postgres-data
          resources:
            limits:
              cpu: 4
              memory: 2048Mi
            requests:
              cpu: 0.5
              memory: 1024Mi
      volumes:
        - name: immich-postgres-data
          persistentVolumeClaim:
            claimName: immich-postgres18-data

