apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifx-mqtt
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "lifx-mqtt-config"
spec:
  selector:
    matchLabels:
      app: lifx-mqtt
  template:
    metadata:
      labels:
        app: lifx-mqtt
    spec:
      priorityClassName: homelab-home
      volumes:
        - name: lifx-mqtt-config
          secret:
            secretName: lifx-mqtt-config

      containers:
        - name: lifx-mqtt
          image: ghcr.io/fruitiex/lifx-mqtt:main@sha256:83896c22ca35980590cf848c12595c48c798b629b61aa74a6e07c614e1df0447
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
              cpu: 100m
          workingDir: /app
          volumeMounts:
            - mountPath: /app
              name: lifx-mqtt-config

      initContainers:
        - name: wait-for-mqtt-broker
          image: busybox
          command: ["sh", "-c", "until nc -z mqtt 1883; do echo waiting for mqtt broker; sleep 1; done"]
