apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrotune
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "ferrotune-env"
spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: ferrotune
  template:
    metadata:
      labels:
        app: ferrotune
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      volumes:
        - name: ferrotune-music
          persistentVolumeClaim:
            claimName: pvc-ferrotune-music
        - name: ferrotune-data
          persistentVolumeClaim:
            claimName: ferrotune-data
        - name: ferrotune-transcodes
          emptyDir:
            sizeLimit: 20Gi
      containers:
        - name: ferrotune
          image: ghcr.io/fruitiex/ferrotune:main@sha256:c4220aa6598daee95130b42e6a55d1833053093b3553efe4fbc5de8a9e4d138e
          envFrom:
            - secretRef:
                name: ferrotune-env
          resources:
            limits:
              memory: 2Gi
              cpu: 1000m
          env:
            - name: TZ
              value: Europe/Helsinki
            - name: PORT
              value: "4040"
            - name: FERROTUNE_FEEDBACK_URL
              value: https://feedback.fruitiex.org
            # Passkey sign-in through Pocket ID (client secret in ferrotune-env)
            - name: FERROTUNE_PUBLIC_URL
              value: https://ferrotune.fruitiex.org
            - name: FERROTUNE_OIDC_ISSUER
              value: https://id.fruitiex.org
            - name: FERROTUNE_OIDC_CLIENT_ID
              value: ferrotune
            - name: FERROTUNE_OIDC_ALLOWED_GROUPS
              value: family,kids
            - name: FERROTUNE_OIDC_ADMIN_GROUP
              value: admins
            # Pocket ID user "rasse" is the local "admin" account
            - name: FERROTUNE_OIDC_USER_MAP
              value: rasse:admin
            - name: FERROTUNE_PORT
              value: "4040"
            - name: FERROTUNE_DB_MAX_CONNECTIONS
              value: "1"
            - name: FERROTUNE_DB_JOURNAL_MODE
              value: "delete"
            - name: FERROTUNE_DB_SYNCHRONOUS
              value: "normal"
            - name: FERROTUNE_DB_LOCKING_MODE
              value: "exclusive"
            - name: FERROTUNE_TRANSCODE_CACHE_PATH
              value: /cache/transcodes
            - name: FERROTUNE_TRANSCODE_CACHE_MAX_MB
              value: "20480"
            #- name: FERROTUNE_DB_BUSY_TIMEOUT
              #value: "1"
          volumeMounts:
            - mountPath: /music
              name: ferrotune-music
            - mountPath: /data
              name: ferrotune-data
            - mountPath: /cache/transcodes
              name: ferrotune-transcodes
