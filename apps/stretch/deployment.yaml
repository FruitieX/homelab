apiVersion: apps/v1
kind: Deployment
metadata:
  name: stretch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stretch
  template:
    metadata:
      labels:
        app: stretch
    spec:
      priorityClassName: homelab-apps
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: stretch
          image: ghcr.io/fruitiex/stretch:b668b563f84159ba0ddd224b85a897db0acace4f@sha256:1e091b8d09c71664a57b244165e0bb9305ae93765e8c8de69dadca683329e0c8
          imagePullPolicy: Always
          env:
            - name: STRETCH_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: RUST_LOG
              value: stretch_api=info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stretch-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
