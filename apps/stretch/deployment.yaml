apiVersion: apps/v1
kind: Deployment
metadata:
  name: stretch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stretch
  template:
    metadata:
      labels:
        app: stretch
    spec:
      priorityClassName: homelab-apps
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: stretch
          image: ghcr.io/fruitiex/stretch:f06ea8fb7ee2ad68ed0bd70c19ae6d953977fad5@sha256:756460e2dfe48cbf1f0b0abf6cc12851ae96760737ba54fc8386f00b2646b6fd
          imagePullPolicy: Always
          env:
            - name: STRETCH_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: RUST_LOG
              value: stretch_api=info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stretch-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
