# Verisure notification bridge (https://github.com/FruitieX/verisure-bridge, private; see llm-wiki
# entities/house-systems): reads the Verisure app's Android notifications from the android-bliss VM
# over adb and publishes them to MQTT. Read-only: it never sends input to the device.
# CI updates the image digest here on pushes to main.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verisure-bridge-data
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verisure-bridge
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "verisure-bridge"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verisure-bridge
  template:
    metadata:
      labels:
        app: verisure-bridge
    spec:
      priorityClassName: homelab-home
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Group access to the cookie file on NFS (/data)
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        # adb keeps its key in ~/.android and its server log in /tmp
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Verisure login and MFA trust cookies
        - name: data
          persistentVolumeClaim:
            claimName: verisure-bridge-data
      containers:
        - name: bridge
          image: ghcr.io/fruitiex/verisure-bridge:main@sha256:3eff7d6e74eaa14e813b13c5c8c3008f8a0c994cb5e7bdf45a9c8a93fa0e69ae
          env:
            - name: HOME
              value: /home/bridge
            - name: MQTT_HOST
              value: mqtt
          envFrom:
            - secretRef:
                name: verisure-bridge
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/bridge
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
