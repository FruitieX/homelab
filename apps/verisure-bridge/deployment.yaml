# Verisure notification bridge (see bridge.py and llm-wiki entities/house-systems):
# reads the Verisure app's Android notifications from the android-bliss VM over
# adb and publishes them to MQTT. Read-only: it never sends input to the device.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verisure-bridge-data
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verisure-bridge
  namespace: default
  annotations:
    configmap.reloader.stakater.com/reload: "verisure-bridge"
    secret.reloader.stakater.com/reload: "verisure-bridge"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verisure-bridge
  template:
    metadata:
      labels:
        app: verisure-bridge
    spec:
      priorityClassName: homelab-home
      volumes:
        - name: script
          configMap:
            name: verisure-bridge
        - name: home
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: verisure-bridge-data
      containers:
        - name: bridge
          image: python:3.13.13-alpine3.23
          command: ["sh", "-c", "apk add --no-cache -q android-tools mosquitto-clients && exec python -u /app/bridge.py"]
          env:
            - name: HOME
              value: /home/bridge
            - name: MQTT_HOST
              value: mqtt
          envFrom:
            - secretRef:
                name: verisure-bridge
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              memory: 160Mi
          volumeMounts:
            - name: script
              mountPath: /app
            - name: home
              mountPath: /home/bridge
            - name: data
              mountPath: /data
