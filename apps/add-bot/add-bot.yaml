apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: add-bot-data
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: add-bot
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: add-bot
  template:
    metadata:
      labels:
        app: add-bot
    spec:
      containers:
        - name: add-bot
          image: ghcr.io/fruitiex/add-bot-rs:main@sha256:0f57570626f73c61c9c1c92b03bf06b7cd1b57a843d7f2bf07b3ce543afe4b8b
          command: ["add-bot"]
          args: ["--tz", "Europe/Helsinki"]
          workingDir: /app
          env:
            - name: ADD_BOT_LEETIFY_MATCH_CACHE_PATH
              value: /app/cache/leetify-matches
          volumeMounts:
            - mountPath: /app
              name: add-bot-data
            - mountPath: /app/Settings.toml
              name: add-bot-config
              subPath: Settings.toml
          resources:
            limits:
              memory: 128Mi
              cpu: 500m
      volumes:
        - name: add-bot-data
          persistentVolumeClaim:
            claimName: add-bot-data
        - name: add-bot-config
          secret:
            secretName: add-bot-config
