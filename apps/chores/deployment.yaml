apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/reload: chores-env
  name: chores
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chores
  template:
    metadata:
      labels:
        app: chores
    spec:
      priorityClassName: homelab-apps
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: chores
          image: ghcr.io/fruitiex/chores:3fc2ff530046710a164fa0bf6fd7ad58fab5f967@sha256:deb23cdb9f27402b32bf4b37b38e98b9985514881c91b8d9eb6417117fe74d51
          imagePullPolicy: Always
          env:
            - name: CHORES_ORIGIN
              value: https://chores.fruitiex.org
            - name: CHORES_FEEDBACK_HUB
              value: https://feedback.fruitiex.org
            - name: CHORES_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: RUST_LOG
              value: chores_api=info
            # Passkey sign-in through Pocket ID; the client secret is in chores-env.
            - name: CHORES_OIDC_ISSUER
              value: https://id.fruitiex.org
            - name: CHORES_OIDC_CLIENT_ID
              value: chores
            - name: CHORES_OIDC_ALLOWED_GROUPS
              value: family
          envFrom:
            - secretRef:
                name: chores-env
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chores-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
