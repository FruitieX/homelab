apiVersion: apps/v1
kind: Deployment
metadata:
  name: chores
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chores
  template:
    metadata:
      labels:
        app: chores
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: chores
          image: ghcr.io/fruitiex/chores:f97f8e11ef8db907becce9a309aab4403186e96a@sha256:228eb6d8828bcd02018b812df71661352217e519ee05c71c7ef1b4953e9d49af
          imagePullPolicy: Always
          env:
            - name: CHORES_ORIGIN
              value: https://chores.fruitiex.org
            - name: CHORES_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: RUST_LOG
              value: chores_api=info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chores-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
