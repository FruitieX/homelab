apiVersion: apps/v1
kind: Deployment
metadata:
  name: chores
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chores
  template:
    metadata:
      labels:
        app: chores
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: chores
          image: ghcr.io/fruitiex/chores:f2352b86b7fca4451d37579793466c412f9a7aba@sha256:6dd24a03de65b4b0d396dc932010bdf71db811ccbd4d08b7f0ce40c6a04b87ea
          imagePullPolicy: Always
          env:
            - name: CHORES_ORIGIN
              value: https://chores.fruitiex.org
            - name: CHORES_FEEDBACK_HUB
              value: https://feedback.fruitiex.org
            - name: CHORES_SQLITE_JOURNAL_MODE
              value: DELETE
            - name: RUST_LOG
              value: chores_api=info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chores-data-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
