# Self-hosted build of busmap (also at busmap.netlify.app): a static site on
# both gateways. The gateway injects the feedback-hub widget; see
# apps/feedback-hub.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busmap
  template:
    metadata:
      labels:
        app: busmap
    spec:
      priorityClassName: homelab-apps
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: busmap
          image: ghcr.io/fruitiex/busmap:main@sha256:6ea7bbb9ae354add51e0ede46d2e578703127bcd02e1b2ca28c5aee897801273
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
