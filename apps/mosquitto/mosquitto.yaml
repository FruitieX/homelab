apiVersion: v1
kind: Service
metadata:
  name: mqtt
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mqtt.fruitiex.org
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
  - name: mqtt
    protocol: TCP
    port: 1883
    targetPort: 1883
  - name: websocket
    protocol: TCP
    port: 9001
    targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: default
  annotations:
    # The reload sidecar's shell script uses `$`.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  selector:
    matchLabels:
      app: mosquitto
  # One writer for the persistence file.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      priorityClassName: homelab-critical
      # Lets the reload sidecar signal mosquitto.
      shareProcessNamespace: true
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0@sha256:09b62ff32c2e7b64d4b431b9a89236073289b68db273de2b089edeb9b0d92b5c
          command: ["mosquitto"]
          args: ["-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 9001
              name: websocket
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
          resources:
            requests:
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 512Mi
        # Mosquitto rereads mosquitto.conf, the password file and the ACL on
        # SIGHUP without dropping clients. The kubelet updates mounted
        # ConfigMap/Secret files a minute or two after Flux applies a change;
        # this sends SIGHUP when they change, so auth changes need no restart.
        - name: reload-on-change
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              state() { cat /mosquitto/config/* /mosquitto/auth/* | md5sum; }
              last=$(state)
              while sleep 20; do
                now=$(state)
                if [ "$now" != "$last" ]; then
                  pkill -HUP -x mosquitto && echo "config changed, sent SIGHUP to mosquitto"
                  last=$now
                fi
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 20m
              memory: 16Mi
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: auth
          secret:
            secretName: mosquitto-auth
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data-nfs
