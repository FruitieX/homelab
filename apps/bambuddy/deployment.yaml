apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambuddy
  namespace: default
  labels:
    app: bambuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bambuddy
  template:
    metadata:
      labels:
        app: bambuddy
    spec:
      priorityClassName: homelab-apps
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bambuddy
          image: ghcr.io/maziggy/bambuddy:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "8000"
            # Pocket ID sign-in (admins only; the client is group-restricted in Pocket ID).
            # Break-glass local admin: 1Password "Bambuddy break-glass admin (homelab)";
            # sign in at /login?fallback=local. Set
            # BAMBUDDY_LOCAL_LOGIN=true if local login ever gets disabled in the UI.
            - name: APP_URL
              value: https://bambuddy.fruitiex.org
            - name: BAMBUDDY_OIDC_NAME
              value: Pocket ID
            - name: BAMBUDDY_OIDC_ISSUER_URL
              value: https://id.fruitiex.org
            - name: BAMBUDDY_OIDC_CLIENT_ID
              value: bambuddy
            - name: BAMBUDDY_OIDC_SCOPES
              value: openid email profile groups
            - name: BAMBUDDY_OIDC_AUTO_CREATE_USERS
              value: "true"
            - name: BAMBUDDY_OIDC_AUTO_LINK_EXISTING
              value: "false"
            - name: BAMBUDDY_OIDC_EMAIL_CLAIM
              value: preferred_username
            - name: BAMBUDDY_OIDC_GROUP_CLAIM
              value: groups
            - name: BAMBUDDY_OIDC_GROUP_MAPPING
              value: '{"admins":"Administrators"}'
            - name: BAMBUDDY_OIDC_DEFAULT_GROUP
              value: Administrators
            - name: BAMBUDDY_OIDC_AUTOLOGIN
              # An exchange failure returns to /login; autologin immediately
              # retries SSO and traps the browser in a redirect loop.
              value: "false"
            # The shared PostgreSQL allows 100 connections in total; Bambuddy's
            # PostgreSQL default (20 + 60 overflow) could starve the other apps.
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "10"
          envFrom:
            - secretRef:
                name: bambuddy-oidc
            - secretRef:
                name: bambuddy-database
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-bambuddy-data
        - name: logs
          persistentVolumeClaim:
            claimName: pvc-bambuddy-logs
