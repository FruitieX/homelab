# Firefox intermittently resets Bambuddy's OIDC exchange POST over HTTP/2;
# the same sign-in succeeds over HTTP/1.1. Isolate the ALPN workaround on a
# separate gateway/IP so the shared private gateway keeps HTTP/2, and browsers
# cannot coalesce Bambuddy requests onto another service's HTTP/2 connection.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: bambuddy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          image: docker.io/envoyproxy/envoy:distroless-v1.39.0@sha256:7877ad87afd7459e1bd2a077ff601fec7c93aeecd62e71664560d96328c62cf4
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
        pod:
          priorityClassName: homelab-apps
          labels:
            homelab.fruitiex.org/gateway: bambuddy
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  homelab.fruitiex.org/gateway: bambuddy
      envoyPDB:
        minAvailable: 1
      envoyService:
        name: envoy-bambuddy
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          external-dns.alpha.kubernetes.io/exclude: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bambuddy
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: bambuddy
  listeners:
    - name: http
      hostname: bambuddy.fruitiex.org
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: default
    - name: https
      hostname: bambuddy.fruitiex.org
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: fruitiex-org-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: default
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: bambuddy-http1
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bambuddy
  tls:
    alpnProtocols:
      - http/1.1
  headers:
    earlyRequestHeaders:
      remove:
        - x-sso-user
        - x-sso-groups
        - x-sso-id-token
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bambuddy-http-redirect
  namespace: default
spec:
  parentRefs:
    - name: bambuddy
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - bambuddy.fruitiex.org
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
