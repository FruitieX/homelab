# Shared PostgreSQL, highly available via CloudNativePG: a primary and one
# streaming replica on different physical hosts (topology.kubernetes.io/zone).
# Apps keep connecting to the `postgres` Service (postgres.yaml), which selects
# the current CNPG primary; postgres-ha-rw/-ro/-r are the CNPG-managed Services.
#
# Storage is nfs-csi on purpose (NFS-first storage policy; hard NFS 4.1
# mounts). Both instances' volumes are on the same NAS, so the NAS is still a
# single point of failure: this cluster survives losing a node or a host, not
# the NAS. Consistent backups come from the postgres-dump CronJob.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-ha
  namespace: default
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610190957-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  priorityClassName: homelab-critical
  # Apps keep idle pool connections open forever, so a smart shutdown of the
  # primary (pod deletion, rolling update) would otherwise wait the default
  # 180 s for them before failing over; switch to a fast shutdown quickly.
  smartShutdownTimeout: 10
  # No PodDisruptionBudget for the primary: draining its node (tuppr's
  # unattended upgrades, node-maintenance.sh) evicts it and CNPG fails over
  # to the replica within seconds, instead of the drain blocking forever.
  enablePDB: false

  # Only maintenance (postgres-dump, operators) uses the superuser.
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-ha-superuser

  # The monolith import does not carry role memberships over. No
  # passwordSecret: the imported password hash is left as it is.
  managed:
    roles:
      - name: grafana_ro
        ensure: present
        login: true
        inRoles:
          - pg_monitor
      # Each app logs in as a role that owns only its own database, so a
      # compromised app can't reach the others or run commands as the
      # superuser. Login secrets: <app>-role.sops.yaml. One-time setup per
      # app, already done (CNPG manages neither ownership nor database ACLs):
      #   ALTER DATABASE <app> OWNER TO <app>; then, in <app>,
      #   ALTER ... OWNER TO <app> for every table, sequence and enum type,
      #   ALTER DEFAULT PRIVILEGES FOR ROLE <app> IN SCHEMA public
      #     GRANT SELECT ON TABLES TO grafana_ro;  (if Grafana reads it)
      #   REVOKE CONNECT ON DATABASE <app> FROM PUBLIC;
      - name: spliit
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        connectionLimit: 20
        passwordSecret:
          name: postgres-spliit
      - name: ferrotune
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        connectionLimit: 30
        passwordSecret:
          name: postgres-ferrotune
      - name: homectl
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        connectionLimit: 30
        passwordSecret:
          name: postgres-homectl

  # Quorum commit to the replica while it is connected; writes continue
  # (asynchronously) when it is not, so one instance being down never blocks.
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
      effective_cache_size: 384MB
      work_mem: 4MB
      maintenance_work_mem: 32MB
      timezone: Etc/UTC
      log_timezone: Etc/UTC

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

  storage:
    storageClass: nfs-csi
    size: 10Gi

  # Only used when the cluster was first created: imported every database
  # and role from the PostgreSQL 16 Deployment (2026-10-26), since removed.
  # Ignored afterwards, but kept: without `import` the webhook defaults the
  # initdb application database to `app`, and the operator would then
  # create a postgres-ha-app secret and try to set a password for the
  # nonexistent role `app` on every reconcile.
  bootstrap:
    initdb:
      encoding: UTF8
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
      import:
        type: monolith
        databases:
          - "*"
        roles:
          - "*"
        source:
          externalCluster: postgres-legacy
  externalClusters:
    - name: postgres-legacy
      connectionParameters:
        host: postgres-legacy.default.svc
        port: "5432"
        user: postgres
        dbname: postgres
        sslmode: disable
