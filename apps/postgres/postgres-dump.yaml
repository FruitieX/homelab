# Nightly logical backup of the shared PostgreSQL to an NFS volume, which the
# NAS's Hyper Backup then copies off. Unlike a file copy of a live data
# directory, these dumps are consistent and restorable:
#   psql -f roles-with-passwords.sql postgres   # roles (globals.sql has no passwords)
#   pg_restore --create -d postgres <db>.dump
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-dumps
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-dump
  namespace: default
spec:
  schedule: "17 1 * * *"
  timeZone: Europe/Helsinki
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          priorityClassName: homelab-batch
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6-202610190957-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
              env:
                - name: PGHOST
                  value: postgres-ha-rw
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-ha-superuser
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-ha-superuser
                      key: password
                - name: KEEP_DAYS
                  value: "14"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/bash", "-ceu"]
              args:
                - |
                  dir=/dumps/$(date +%F)
                  mkdir -p "$dir.tmp"
                  pg_dumpall --globals-only --no-role-passwords > "$dir.tmp/globals.sql"
                  pg_dumpall --roles-only > "$dir.tmp/roles-with-passwords.sql"
                  chmod 600 "$dir.tmp/roles-with-passwords.sql"
                  for db in $(psql -d postgres -Atc "select datname from pg_database where not datistemplate and datname <> 'postgres'"); do
                    pg_dump -Fc -d "$db" -f "$dir.tmp/$db.dump"
                  done
                  rm -rf "$dir" && mv "$dir.tmp" "$dir"
                  find /dumps -mindepth 1 -maxdepth 1 -type d -mtime +"$KEEP_DAYS" -exec rm -rf {} +
                  ls -la "$dir"
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: postgres-dumps
