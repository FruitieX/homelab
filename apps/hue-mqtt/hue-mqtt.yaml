apiVersion: apps/v1
kind: Deployment
metadata:
  name: hue-mqtt
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "hue-mqtt-config"
spec:
  selector:
    matchLabels:
      app: hue-mqtt
  template:
    metadata:
      labels:
        app: hue-mqtt
    spec:
      volumes:
        - name: hue-mqtt-config
          secret:
            secretName: hue-mqtt-config

      containers:
        - name: hue-mqtt
          image: ghcr.io/fruitiex/hue-mqtt:main@sha256:922d4da6ac956a2df0d27850f5adb8ffdbef6cf93e89e8faa8c8f0e3114555ff
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
          workingDir: /app
          volumeMounts:
            - mountPath: /app
              name: hue-mqtt-config

      initContainers:
        - name: wait-for-mqtt-broker
          image: busybox
          command: ["sh", "-c", "until nc -z mqtt 1883; do echo waiting for mqtt broker; sleep 1; done"]
