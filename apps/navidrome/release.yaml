apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: default
spec:
  interval: 99999h
  timeout: 5m
  chart:
    spec:
      chart: navidrome
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: djjudas21
        namespace: flux-system
  values:
    env:
      ND_MUSICFOLDER: "/music"
      ND_LOGLEVEL: "info"
      ND_ENABLETRANSCODINGCONFIG: "true"
      ND_SESSIONTIMEOUT: "72h"
      TZ: "Europe/Helsinki"

    ingress:
      main:
        enabled: false

    persistence:
      config:
        enabled: true
        type: pvc
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: nfs-csi
      music:
        enabled: true
        type: pvc
        existingClaim: pvc-navidrome-music
        mountPath: /music
        readOnly: true
