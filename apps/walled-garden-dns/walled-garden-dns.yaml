# DNS for the Wi-Fi portal VLAN 80 only (UniFi DHCP hands out 192.168.11.96
# as the only DNS server there). Pocket ID and the portal resolve to the private
# gateway; every other name resolves to Radiator's captive listener
# (radiator-captive, 192.168.11.95), so OS captive-portal probes get a 302 to
# https://wifi.fruitiex.org/. See apps/radiator/radiator.yaml (wifi-portal.radconf).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: walled-garden-dns
  namespace: default
data:
  Corefile: |
    # Unprivileged port; the Service maps 53 to it.
    .:1053 {
        errors
        # CoreDNS runs "template" before "hosts", so both answers are templates.
        template IN A {
            match "^(id|wifi)\.fruitiex\.org\.$"
            answer "{{ .Name }} 30 IN A 192.168.11.99"
            fallthrough
        }
        template IN A {
            answer "{{ .Name }} 30 IN A 192.168.11.95"
        }
        # AAAA, HTTPS and everything else: empty answer.
        template IN ANY {
            rcode NOERROR
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: walled-garden-dns
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: walled-garden-dns
  template:
    metadata:
      labels:
        app: walled-garden-dns
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: coredns
          image: docker.io/coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 1053
              protocol: UDP
            - name: dns-tcp
              containerPort: 1053
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: walled-garden-dns
---
apiVersion: v1
kind: Service
metadata:
  name: walled-garden-dns
  namespace: default
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.11.96
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: walled-garden-dns
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 1053
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 1053
