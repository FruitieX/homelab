# Gridfinity base swapper (FruitieX/rsfinity): a static site, all processing
# happens in the browser.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsfinity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsfinity
  template:
    metadata:
      labels:
        app: rsfinity
    spec:
      priorityClassName: homelab-apps
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: rsfinity
          image: ghcr.io/fruitiex/rsfinity:main@sha256:812f7548e726e9ba2e6614f30706c49a93ece174cc815b1bdbeae0ca4f1f77e6
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
