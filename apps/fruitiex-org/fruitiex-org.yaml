apiVersion: v1
kind: Service
metadata:
  name: fruitiex-org
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: fruitiex-org
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fruitiex-org
  namespace: default
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - fruitiex.org
    - www.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: fruitiex-org
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lovegren-fi
  namespace: default
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - lovegren.fi
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: fruitiex-org
          port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruitiex-org
  namespace: default
spec:
  selector:
    matchLabels:
      app: fruitiex-org
  template:
    metadata:
      labels:
        app: fruitiex-org
    spec:
      priorityClassName: homelab-apps
      # The image's non-root nginx keeps listening on port 80.
      securityContext:
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: fruitiex-org
          image: ghcr.io/fruitiex/fruitiex.org:main@sha256:1f9e435de5f70d1a29e74475b18bacdeb8dcad7915f7014a82df255d7d161f9e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
              cpu: 100m
