apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oriel-hub
spec:
  # Private: devices away from home reach it over the VPN.
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - oriel.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oriel-hub
          port: 8080
