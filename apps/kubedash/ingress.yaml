apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubedash
spec:
  # Private gateway only: kubedash can restart workloads and has no login of its own.
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - kubedash.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kubedash
          port: 8080
      timeouts:
        # Log streams are long-lived.
        request: 0s
