apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vectorbound-files-nfs
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  resources:
    requests:
      # Demo builds (~900 MB each) plus room for the next couple.
      storage: 8Gi
