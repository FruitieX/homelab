apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectorbound
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vectorbound
  template:
    metadata:
      labels:
        app: vectorbound
    spec:
      priorityClassName: homelab-apps
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: vectorbound
          # Updated by .github/workflows/update-image.yaml on a push to FruitieX/strafe-site.
          image: ghcr.io/fruitiex/strafe-site:main@sha256:a4f19aa17f5dbdc0638f73d927bb8bfa7d942585acb5357b8f42acf1d31c9978
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: files
              mountPath: /srv/files
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: vectorbound-web
        - name: files
          persistentVolumeClaim:
            claimName: vectorbound-files-nfs
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
