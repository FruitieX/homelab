apiVersion: apps/v1
kind: Deployment
metadata:
  name: homectl
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "homectl-server-env"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homectl
  template:
    metadata:
      labels:
        app: homectl
    spec:
      containers:
        - name: homectl
          image: ghcr.io/fruitiex/homectl:main@sha256:e608bb96a124b41f7ba8830f4383ee6dd2a407dd34ea74934b3a866bc5e562ef
          envFrom:
            - secretRef:
                name: homectl-server-env
          env:
            - name: TZ
              value: Europe/Helsinki
            - name: RUST_LOG
              value: "homectl_server=info"
            - name: CONFIG_FILE
              value: /app/Settings.toml
            - name: HOMECTL_UI_DIST_DIR
              value: /app/ui/dist
            # Sign-in with Pocket ID; client secret and machine tokens are in
            # homectl-server-env (HOMECTL_OIDC_CLIENT_SECRET, HOMECTL_API_TOKENS).
            - name: HOMECTL_OIDC_ISSUER
              value: https://id.fruitiex.org
            - name: HOMECTL_OIDC_CLIENT_ID
              value: homectl
            - name: HOMECTL_PUBLIC_URL
              value: https://homectl.fruitiex.org
            - name: HOMECTL_OIDC_ALLOWED_GROUPS
              value: family
            - name: HOMECTL_OIDC_ADMIN_GROUPS
              value: admins
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - name: http
              containerPort: 45289
          workingDir: /app
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10

      initContainers:
        - name: wait-for-mqtt-broker
          image: busybox
          command:
            [
              "sh",
              "-c",
              "until nc -z mqtt 1883; do echo waiting for mqtt broker; sleep 1; done",
            ]
