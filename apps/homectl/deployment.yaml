apiVersion: apps/v1
kind: Deployment
metadata:
  name: homectl
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "homectl-server-env"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homectl
  template:
    metadata:
      labels:
        app: homectl
    spec:
      containers:
        - name: homectl
          image: ghcr.io/fruitiex/homectl:main@sha256:db1b12d88c7fee125aed5366bd4ea338dc4f71f2a1a45e3cf7c411b8a5d022a7
          envFrom:
            - secretRef:
                name: homectl-server-env
          env:
            - name: TZ
              value: Europe/Helsinki
            - name: RUST_LOG
              value: "homectl_server=info"
            - name: CONFIG_FILE
              value: /app/Settings.toml
            - name: HOMECTL_UI_DIST_DIR
              value: /app/ui/dist
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - name: http
              containerPort: 45289
          workingDir: /app
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10

      initContainers:
        - name: wait-for-mqtt-broker
          image: busybox
          command:
            [
              "sh",
              "-c",
              "until nc -z mqtt 1883; do echo waiting for mqtt broker; sleep 1; done",
            ]
