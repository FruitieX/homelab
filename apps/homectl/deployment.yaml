apiVersion: apps/v1
kind: Deployment
metadata:
  name: homectl
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "homectl-server-env"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homectl
  template:
    metadata:
      labels:
        app: homectl
    spec:
      containers:
        - name: homectl
          image: ghcr.io/fruitiex/homectl:main@sha256:c4cded3e4f5cb6de3f6149bbd6c453bb8b26597300aabf2f17a94ca3faee409b
          envFrom:
            - secretRef:
                name: homectl-server-env
          env:
            - name: TZ
              value: Europe/Helsinki
            - name: RUST_LOG
              value: "homectl_server=info"
            - name: CONFIG_FILE
              value: /app/Settings.toml
            - name: HOMECTL_UI_DIST_DIR
              value: /app/ui/dist
            - name: HOMECTL_ASSISTANT_BASE_URL
              value: https://opencode.ai/zen/v1
            - name: HOMECTL_ASSISTANT_MODEL
              value: deepseek-v4.1-flash
            - name: HOMECTL_ASSISTANT_REASONING_EFFORT
              value: high
            - name: HOMECTL_ASSISTANT_MAX_TOKENS
              value: "8192"
            - name: HOMECTL_ASSISTANT_TIMEOUT_MS
              value: "120000"
            - name: HOMECTL_ASSISTANT_TIMEZONE
              value: Europe/Helsinki
            - name: HOMECTL_ASSISTANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homectl-server-env
                  key: HOMECTL_ASSISTANT_API_KEY
                  optional: true
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - name: http
              containerPort: 45289
          workingDir: /app

      initContainers:
        - name: wait-for-mqtt-broker
          image: busybox
          command:
            [
              "sh",
              "-c",
              "until nc -z mqtt 1883; do echo waiting for mqtt broker; sleep 1; done",
            ]
