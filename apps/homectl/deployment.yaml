apiVersion: apps/v1
kind: Deployment
metadata:
  name: homectl
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "homectl-server-env"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homectl
  template:
    metadata:
      labels:
        app: homectl
    spec:
      containers:
        - name: homectl
          image: ghcr.io/fruitiex/homectl:main@sha256:f7a7d9e5d12c292f92dbbbd1da8b0f5951fa06510c8bde756f79f2d99e7896d5
          envFrom:
            - secretRef:
                name: homectl-server-env
          env:
            - name: TZ
              value: Europe/Helsinki
            - name: RUST_LOG
              value: "homectl_server=info"
            - name: CONFIG_FILE
              value: /app/Settings.toml
            - name: HOMECTL_UI_DIST_DIR
              value: /app/ui/dist
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - name: http
              containerPort: 45289
          workingDir: /app
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10

      initContainers:
        - name: wait-for-mqtt-broker
          image: busybox
          command:
            [
              "sh",
              "-c",
              "until nc -z mqtt 1883; do echo waiting for mqtt broker; sleep 1; done",
            ]
