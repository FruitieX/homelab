# certificate; Envoy trusts only that host's Proxmox root CA (public, from
# /etc/pve/pve-root-ca.pem; the hosts aren't clustered, so each has its own).
# Break-glass when the cluster is down: https://<host IP>:8006 and root@pam.
# The hosts sign in through Pocket ID themselves (realm pocket-id, client
# proxmox), so there is no gateway OIDC gate here.
