---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adb-mqtt-data
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adb-mqtt
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "adb-mqtt-config"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adb-mqtt
  template:
    metadata:
      labels:
        app: adb-mqtt
    spec:
      volumes:
        - name: adb-mqtt-config
          secret:
            secretName: adb-mqtt-config
        - name: adb-mqtt-data
          persistentVolumeClaim:
            claimName: adb-mqtt-data

      containers:
        - name: adb-mqtt
          image: ghcr.io/fruitiex/adb-mqtt:main@sha256:dd1fa08535f796729deea3cfb43defe5c0f5af53e4e1251c093089686c6d9a1b
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
          workingDir: /app
          volumeMounts:
            - mountPath: /app
              name: adb-mqtt-config
            - mountPath: /root/.android
              name: adb-data

      initContainers:
        - name: wait-for-mqtt-broker
          image: busybox
          command: ["sh", "-c", "until nc -z mqtt 1883; do echo waiting for mqtt broker; sleep 1; done"]
