apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radiator-config
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radiator-postgres-data
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: radiator-postgres
  namespace: default
spec:
  selector:
    app: radiator-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radiator-postgres
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radiator-postgres
  template:
    metadata:
      labels:
        app: radiator-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18@sha256:0377e72c5289ed2f98cf61b1a9c2db9eb9d300317fe14244492fbc94343b3d04
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: radiatordb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: radiator-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: radiator-radius
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/hostname: radius.fruitiex.org
    metallb.universe.tf/loadBalancerIPs: 192.168.11.98
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: radiator
  ports:
    - name: radius-auth
      protocol: UDP
      port: 1812
      targetPort: 1812
    - name: radius-acct
      protocol: UDP
      port: 1813
      targetPort: 1813
    - name: radsec
      protocol: TCP
      port: 2083
      targetPort: 2083
---
apiVersion: v1
kind: Service
metadata:
  name: radiator-management
  namespace: default
spec:
  selector:
    app: radiator
  ports:
    - name: management
      protocol: TCP
      port: 8443
      targetPort: 8443
---
# Wi-Fi portal behind https://wifi.fruitiex.org (sso.yaml).
apiVersion: v1
kind: Service
metadata:
  name: radiator-portal
  namespace: default
spec:
  selector:
    app: radiator
  ports:
    - name: portal
      protocol: TCP
      port: 8088
      targetPort: 8088
---
# Captive-portal probe redirect for the walled-garden VLAN 80
# (apps/walled-garden-dns resolves every other name here).
apiVersion: v1
kind: Service
metadata:
  name: radiator-captive
  namespace: default
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.11.95
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  type: LoadBalancer
  # Keeps the device address visible to Radiator's CAPTIVE client list.
  externalTrafficPolicy: Local
  selector:
    app: radiator
  ports:
    - name: captive-http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radiator
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radiator
  template:
    metadata:
      labels:
        app: radiator
    spec:
      securityContext:
        runAsNonRoot: true
      # The UniFi console's self-signed certificate is issued to unifi.local.
      hostAliases:
        - ip: 192.168.1.1
          hostnames:
            - unifi.local
      initContainers:
        - name: initialize-config
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
          args:
            - >-
              if [ ! -f /var/lib/radiator/.bootstrap-complete-v10 ]; then
                rm -f /var/lib/radiator/*.radconf /var/lib/radiator/..data;
                rm -rf /var/lib/radiator/..20*;
                for config in /bootstrap/*.radconf; do
                  cp -L "$config" "/var/lib/radiator/$(basename "$config")";
                done;
                touch /var/lib/radiator/.bootstrap-complete-v10;
              fi;
              mkdir -p /var/lib/radiator/licenses /var/lib/radiator/tmp /var/lib/radiator/management/tls/certs /var/lib/radiator/management/tls/keys /var/log/radiator;
              chown -R 1000:1000 /var/lib/radiator /var/log/radiator;
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          volumeMounts:
            - name: bootstrap-config
              mountPath: /bootstrap
              readOnly: true
            - name: radiator-config
              mountPath: /var/lib/radiator
            - name: radiator-logs
              mountPath: /var/log/radiator
        - name: wait-for-postgres
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
          args:
            - >-
              until nc -z -w 1 radiator-postgres.default.svc.cluster.local 5432;
              do echo 'waiting for PostgreSQL'; sleep 2; done
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
      containers:
        - name: radiator
          image: radiatorsoftware/radiator-server:nightly@sha256:30a7a571a24e30860f1355579ae7231f3c61916ac0cd21d2c0c5b6735ae53137
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RADIUS_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: RADIUS_SHARED_SECRET
            - name: RADIATORDB_DB_HOST
              value: radiator-postgres.default.svc.cluster.local
            - name: RADIATORDB_DB_USER
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: POSTGRES_USER
            - name: RADIATORDB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: POSTGRES_PASSWORD
            # Shared with the private gateway's HTTPRouteFilter (sso.yaml).
            - name: RADIATOR_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: radiator-proxy-secret
                  key: credential
            # UniFi Network API (Wi-Fi portal: device IP -> MAC).
            - name: UNIFI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: UNIFI_API_KEY
          ports:
            - name: management
              containerPort: 8443
              protocol: TCP
            - name: radius-auth
              containerPort: 1812
              protocol: UDP
            - name: radius-acct
              containerPort: 1813
              protocol: UDP
            - name: radsec
              containerPort: 2083
              protocol: TCP
            - name: portal
              containerPort: 8088
              protocol: TCP
            - name: captive
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: radiator-config
              mountPath: /var/lib/radiator
            - name: management-certificate
              mountPath: /var/lib/radiator/management/tls/certs
              readOnly: true
            - name: management-key
              mountPath: /var/lib/radiator/management/tls/keys
              readOnly: true
            - name: management-users
              mountPath: /etc/radiator/management-users
              readOnly: true
            - name: radiator-logs
              mountPath: /var/log/radiator
            - name: unifi-console-cert
              mountPath: /etc/radiator/unifi
              readOnly: true
          livenessProbe:
            httpGet:
              path: /live
              port: management
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: management
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: 100Mi
            limits:
              cpu: 1000m
              memory: 100Mi
      volumes:
        - name: bootstrap-config
          configMap:
            name: radiator-bootstrap-config
        - name: management-certificate
          secret:
            secretName: fruitiex-org-tls
            items:
              - key: tls.crt
                path: MANAGEMENT_API_CERT.pem
        - name: management-key
          secret:
            secretName: fruitiex-org-tls
            items:
              - key: tls.key
                path: MANAGEMENT_API_KEY.pem
        - name: management-users
          secret:
            secretName: radiator-secrets
            items:
              - key: MANAGEMENT_USERS_JSON
                path: management-users.json
        - name: radiator-config
          persistentVolumeClaim:
            claimName: radiator-config
        - name: radiator-logs
          emptyDir: {}
        - name: unifi-console-cert
          configMap:
            name: unifi-console-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiator-management
  namespace: default
spec:
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - radiator.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: radiator-proxy-secret
      backendRefs:
        - name: radiator-management
          port: 8443
