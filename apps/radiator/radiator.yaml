apiVersion: v1
kind: ConfigMap
metadata:
  name: radiator-bootstrap-config
  namespace: default
data:
  management-access.radconf: |
    clients {
        http "MANAGEMENT_ACCESS_ALLOW_LIST" {
            # The management endpoint is reachable through the private Gateway.
            client "PRIVATE_NETWORK" {
                source {
                    ip 10.244.0.0/16;
                }
            }
        }
    }
  management.radconf: |
    management {
        http {
            listen {
                protocol tcp;
                port 8443;
                ip 0.0.0.0;
            }

            clients "MANAGEMENT_ACCESS_ALLOW_LIST";
            policy "MANAGEMENT";

            # "Sign in with Pocket ID" (client radiator-ui); management-auth.radconf
            # maps the groups claim. Password sign-in stays for break-glass.
            oidc "pocket-id" {
                title "Pocket ID";
                issuer "https://id.fruitiex.org";
                client_id "radiator-ui";
                client_secret env.RADIATOR_UI_OIDC_CLIENT_SECRET;
                redirect_url "https://radiator.fruitiex.org/api/v1/auth/oidc/pocket-id/callback";
                scopes "openid profile email groups";
                identity_claim "preferred_username";
            }
        }
    }
  logging.radconf: |
    logging {
        aaa {
            logger "AUTHENTICATION" {
                memory {
                    loglevel info;
                    size 4096;
                }

                console {
                    loglevel info;
                }
            }

            logger "ACCOUNTING" {
                memory {
                    loglevel info;
                    size 4096;
                }

                console {
                    loglevel info;
                }
            }
        }
    }

    aaa {
        @pipeline "LOG_AUTHENTICATION" {
            log "AUTHENTICATION" {
                json {
                    "timestamp" datetime.timestamp;
                    "User-Name" aaa.identity;
                    "Result" "%{aaa.result}";
                    "Reason" aaa.reason;
                    "Errors" aaa.errors;
                    "Policy" aaa.policy;
                    "Handler" aaa.handler;
                    "Context-Id" "%{context.id}";
                    "Elapsed-Time" context.latency;
                    "Client-IP-Address" radius.client.ip;
                    "Client-Identifier" radius.client;
                    "NAS-IP-Address" radius.request.attr.NAS-IP-Address;
                    "NAS-Identifier" radius.request.attr.NAS-Identifier;
                    "Calling-Station-Id" radius.request.attr.Calling-Station-Id;
                    "Called-Station-Id" radius.request.attr.Called-Station-Id;
                    "Request-Code" "%{radius.request.code}";
                    "Request-Attributes" radius.request.attrs;
                    "Reply-Code" "%{radius.reply.code}";
                    "Reply-Attributes" radius.reply.attrs;
                }
            }
        }

        @pipeline "LOG_ACCOUNTING" {
            log "ACCOUNTING" {
                json {
                    "timestamp" datetime.timestamp;
                    "User-Name" aaa.identity;
                    "Result" "%{aaa.result}";
                    "Reason" aaa.reason;
                    "Errors" aaa.errors;
                    "Policy" aaa.policy;
                    "Handler" aaa.handler;
                    "Context-Id" "%{context.id}";
                    "Elapsed-Time" context.latency;
                    "Client-IP-Address" radius.client.ip;
                    "Client-Identifier" radius.client;
                    "NAS-IP-Address" radius.request.attr.NAS-IP-Address;
                    "NAS-Identifier" radius.request.attr.NAS-Identifier;
                    "Calling-Station-Id" radius.request.attr.Calling-Station-Id;
                    "Called-Station-Id" radius.request.attr.Called-Station-Id;
                    "Acct-Status-Type" radius.request.attr.Acct-Status-Type;
                    "Acct-Session-Id" radius.request.attr.Acct-Session-Id;
                    "Acct-Session-Time" radius.request.attr.Acct-Session-Time;
                    "Acct-Input-Octets" radius.request.attr.Acct-Input-Octets;
                    "Acct-Output-Octets" radius.request.attr.Acct-Output-Octets;
                    "Acct-Terminate-Cause" radius.request.attr.Acct-Terminate-Cause;
                    "Request-Code" "%{radius.request.code}";
                    "Request-Attributes" radius.request.attrs;
                    "Reply-Code" "%{radius.reply.code}";
                    "Reply-Attributes" radius.reply.attrs;
                }
            }
        }
    }
  management-auth.radconf: |
    backends {
        jsonfile "MANAGEMENT_USERS" {
            filename "/etc/radiator/management-users/management-users.json";
            monitor false;

            query "FIND_USER" {
                mapping {
                    user.username = doc | jsonpath("$.users[?(@.username == '%{aaa.identity}')].username");
                    user.password = doc | jsonpath("$.users[?(@.username == '%{aaa.identity}')].password");
                    user.privilege = doc | jsonpath("$.users[?(@.username == '%{aaa.identity}')].privilege");
                    user.radiatordb_role = doc | jsonpath("$.users[?(@.username == '%{aaa.identity}')].roles[*]");
                }
            }
        }
    }

    aaa {
        policy "MANAGEMENT" {
            conditions all {
                http.management == true;
            }

            handler "AUTHENTICATION" {
                @execute {
                    http_management_authentication {
                        # Runs at sign-in and when the session authorization is
                        # refreshed; Pocket ID sessions keep their claims.
                        @resolve {
                            if all {
                                oidc.provider == "pocket-id";
                            } then {
                                user.username = aaa.identity;
                                user.privilege = "monitor";

                                if all {
                                    oidc.claims.groups == "admins";
                                } then {
                                    user.privilege = "all";
                                    user.radiatordb_role = "admin";
                                }
                            } else {
                                # Break-glass: password users, for example through
                                # kubectl port-forward.
                                backend {
                                    name "MANAGEMENT_USERS";
                                    query "FIND_USER";
                                }
                            }
                        }

                        # Password sign-in only; Pocket ID verified its users.
                        @verify {
                            http_basic_auth;
                        }
                    }
                }
            }
        }
    }
  radius.radconf: |
    clients {
        radius "RADIUS_CLIENTS" {
            client "LAN" {
                source {
                    ip 192.168.11.0/24;
                    ip 192.168.1.0/24;
                }
                secret env.RADIUS_SHARED_SECRET;
            }
        }
    }

    certificates {
        x509 "MANAGEMENT_API_CERT" {
            filename "<root>/management/tls/certs/MANAGEMENT_API_CERT.pem";
        }
        key "MANAGEMENT_API_KEY" {
            filename "<root>/management/tls/keys/MANAGEMENT_API_KEY.pem";
        }
    }

    servers {
        radius "RADIUS_AUTH" {
            listen {
                protocol udp;
                ip 0.0.0.0;
                port 1812;
            }
            clients "RADIUS_CLIENTS";
        }

        radius "RADIUS_ACCOUNTING" {
            listen {
                protocol udp;
                ip 0.0.0.0;
                port 1813;
            }
            clients "RADIUS_CLIENTS";
        }

        radius "RADSEC" {
            listen {
                protocol tls;
                ip 0.0.0.0;
                port 2083;
                timeout 0;
                tls {
                    certificate "MANAGEMENT_API_CERT";
                    certificate_key "MANAGEMENT_API_KEY";
                    require_client_certificate false;
                }
            }
            clients "RADIUS_CLIENTS";
        }
    }
  passpoint-certificates.radconf: |
    # Private Wi-Fi PKI for the Passpoint SSID (wifi-provisioning.radconf). The
    # root CA is embedded in the device profiles; its key is kept offline
    # (apps/radiator/pki/ca-key.sops.yaml, not applied). The server certificate
    # has CN and DNS SAN radius.fruitiex.org: Android suffix-matches the DNS SAN
    # against the profile FQDN fruitiex.org, iOS matches TLSTrustedServerNames.
    certificates {
        x509 "PASSPOINT_SERVER_CERT" {
            # Leaf first, then any intermediates; Radiator sends the whole file.
            filename "/var/lib/radiator/passpoint/tls/server.pem";
        }
        key "PASSPOINT_SERVER_KEY" {
            filename "/var/lib/radiator/passpoint/tls/server.key";
        }
    }
  radius-policy.radconf: |
    aaa {
        policy "RADIUS_AUTH" {
            conditions all {
                radius.request.code == radius.ACCESS_REQUEST;
            }

            # Passpoint SSID: EAP-TTLS/PAP with per-device credentials issued at
            # https://wifi.fruitiex.org (wifi-provisioning.radconf). Handlers
            # match in order, so keep this before the existing EAP handler.
            handler "PASSPOINT" {
                conditions all {
                    # UniFi sends Called-Station-Id as "<BSSID>:<SSID>".
                    radius.request.attr.Called-Station-Id == /:dragonfruit-radiator$/;
                }

                @execute {
                    eap {
                        eap_ttls {
                            tls {
                                certificate "PASSPOINT_SERVER_CERT";
                                certificate_key "PASSPOINT_SERVER_KEY";
                                require_client_certificate false;
                            }

                            @authentication {
                                # Android always sends anonymous@<realm> outside
                                # the tunnel; the Apple profile sets the same.
                                if all {
                                    root.eap.identity != "anonymous@fruitiex.org";
                                } then {
                                    reject "Unexpected outer identity";
                                }

                                backend {
                                    name "radiatordb";
                                    query "FIND_WIFI_CREDENTIAL";
                                }

                                if all {
                                    vars.revoked == true;
                                } then {
                                    reject "Credential revoked";
                                }

                                # Compares with the stored {argon2} hash.
                                pap;
                            }

                            @authorization {
                                # TTLS pipelines run in the tunnel's child context:
                                # write the outer Access-Accept through root.
                                # Members get the SSID's own network (Default
                                # LAN), so no VLAN attributes.
                                if all {
                                    vars.vlan != "lan";
                                } then {
                                    root.radius.reply.attr.Tunnel-Type:1 = "VLAN";
                                    root.radius.reply.attr.Tunnel-Medium-Type:1 = "Ether_802";
                                    root.radius.reply.attr.Tunnel-Private-Group-Id:1 = vars.vlan;
                                }
                                # Bounds how long a revoked device stays connected.
                                root.radius.reply.attr.Session-Timeout = 28800;
                            }
                        }
                    }
                }

                @final-execute {
                    invoke "LOG_AUTHENTICATION";
                }
            }

            handler "AUTHENTICATION" {
                @execute {
                    eap {
                        eap-ttls {
                            tls {
                                certificate "MANAGEMENT_API_CERT";
                                certificate_key "MANAGEMENT_API_KEY";
                                require_client_certificate false;
                            }

                            @authentication {
                                backend {
                                    name "radiatordb";
                                    query "FIND_USER";
                                }
                                pap;
                            }
                        }
                    }
                }
                @final-execute {
                    invoke "LOG_AUTHENTICATION";
                }
            }
        }

        policy "RADIUS_ACCOUNTING" {
            conditions all {
                radius.request.code == radius.ACCOUNTING_REQUEST;
            }

            handler "ACCOUNTING" {
                @execute {
                    accept;
                }
                @final-execute {
                    invoke "LOG_ACCOUNTING";
                }
            }
        }
    }
  radiatordb.radconf: |
    backends {
        radiatordb "radiatordb" {
            server "pg1" {
                host env.RADIATORDB_DB_HOST;
                port 5432;
                database "radiatordb";
                username env.RADIATORDB_DB_USER;
                password env.RADIATORDB_DB_PASSWORD;
            }

            query "FIND_USER" {
                collection "users";
                key aaa.identity;

                mapping {
                    user.username = key[0];
                    user.password = doc | jsonpath("$.password");
                }
            }

            # Passpoint EAP-TTLS/PAP credentials, one per device
            # (wifi-provisioning.radconf). The key is the random username in the
            # device's profile, i.e. the inner EAP identity.
            query "FIND_WIFI_CREDENTIAL" {
                collection "wifi_credentials";
                key aaa.identity;

                mapping {
                    user.username = key[0];
                    user.password = doc | jsonpath("$.password_hash");
                    vars.password_hash = doc | jsonpath("$.password_hash");
                    vars.owner = doc | jsonpath("$.owner");
                    vars.kind = doc | jsonpath("$.kind");
                    vars.approved_by = doc | jsonpath("$.approved_by");
                    vars.device_name = doc | jsonpath("$.device_name");
                    vars.vlan = doc | jsonpath("$.vlan");
                    vars.created = doc | jsonpath("$.created");
                    vars.revoked = doc | jsonpath("$.revoked");
                }
            }

            # Issue. "expire" is the credential lifetime for members and guests
            # alike: afterwards the document isn't returned and authentication
            # fails.
            put "SAVE_WIFI_CREDENTIAL" {
                collection "wifi_credentials";
                key vars.username;
                expire 365d;

                bindings {
                    password_hash = vars.password_hash;
                    owner = vars.owner;
                    kind = vars.kind;
                    approved_by = vars.approved_by;
                    device_name = vars.device_name;
                    vlan = vars.vlan;
                    created = vars.created;
                    revoked = vars.revoked;
                }
            }

            # Revoke: keep the record (marked revoked) for 30 days for auditing.
            put "REVOKE_WIFI_CREDENTIAL" {
                collection "wifi_credentials";
                key vars.username;
                expire 30d;

                bindings {
                    password_hash = vars.password_hash;
                    owner = vars.owner;
                    kind = vars.kind;
                    approved_by = vars.approved_by;
                    device_name = vars.device_name;
                    vlan = vars.vlan;
                    created = vars.created;
                    revoked = true;
                    revoked_by = vars.sso_user;
                }
            }

            query "LIST_WIFI_CREDENTIALS" {
                collection "wifi_credentials";
                where {
                    owner == vars.owner;
                }

                mapping {
                    vars.list_username = key[0];
                    vars.list_device_name = doc | jsonpath("$.device_name");
                    vars.list_created = doc | jsonpath("$.created");
                    vars.list_revoked = doc | jsonpath("$.revoked");
                }
            }

            # Admin page: every credential, newest first.
            query "LIST_ALL_WIFI_CREDENTIALS" {
                collection "wifi_credentials";

                mapping {
                    vars.list_username = key[0];
                    vars.list_owner = doc | jsonpath("$.owner");
                    vars.list_kind = doc | jsonpath("$.kind");
                    vars.list_approved_by = doc | jsonpath("$.approved_by");
                    vars.list_device_name = doc | jsonpath("$.device_name");
                    vars.list_created = doc | jsonpath("$.created");
                    vars.list_revoked = doc | jsonpath("$.revoked");
                }
            }

            # Guest requests, keyed by the token in the guest's QR code:
            # pending -> approved (by an admin) -> issued (profile downloaded).
            query "FIND_GUEST_REQUEST" {
                collection "wifi_guest_requests";
                key vars.token;

                mapping {
                    vars.request_status = doc | jsonpath("$.status");
                    vars.approved_by = doc | jsonpath("$.approved_by");
                    vars.requested = doc | jsonpath("$.requested");
                }
            }

            put "SAVE_GUEST_REQUEST" {
                collection "wifi_guest_requests";
                key vars.token;
                expire 30m;

                bindings {
                    status = vars.request_status;
                    approved_by = vars.approved_by;
                    requested = vars.requested;
                }
            }

            collection "users" {
                name "Users";
                description "Test user credentials";

                roles {
                    read "admin";
                    write "admin";
                }

                key {
                    field {
                        name "Username";
                        type text;
                    }
                }

                field "password" {
                    name "Password";
                    type password;
                    required true;
                    masked true;
                }
            }

            collection "wifi_credentials" {
                name "Wi-Fi credentials";
                description "Per-device Passpoint credentials (member: LAN, guest: VLAN 81). Revoke at https://wifi.fruitiex.org/admin.";

                roles {
                    read "admin";
                    write "admin";
                }

                key {
                    field {
                        name "Username";
                        type text;
                    }
                }

                field "password_hash" {
                    name "Password hash";
                    type password;
                    masked true;
                }

                field "owner" {
                    name "Owner";
                    type text;
                }

                field "kind" {
                    name "Kind";
                    type text;
                }

                field "approved_by" {
                    name "Approved by";
                    type text;
                }

                field "device_name" {
                    name "Device";
                    type text;
                }

                field "vlan" {
                    name "VLAN";
                    type text;
                }

                field "created" {
                    name "Created";
                    type text;
                }

                field "revoked" {
                    name "Revoked";
                    type boolean;
                    default false;
                }

                field "revoked_by" {
                    name "Revoked by";
                    type text;
                }
            }

            collection "wifi_guest_requests" {
                name "Wi-Fi guest requests";
                description "Guest approvals in progress (expire after 30 minutes)";

                roles {
                    read "admin";
                }

                key {
                    field {
                        name "Token";
                        type text;
                    }
                }

                field "status" {
                    name "Status";
                    type text;
                }

                field "approved_by" {
                    name "Approved by";
                    type text;
                }

                field "requested" {
                    name "Requested";
                    type text;
                }
            }
            # Unused since the switch to Passpoint (2026-10-23). RadiatorDB
            # records the collection list at setup and refuses to start if a
            # collection disappears, so the old MAC-portal collections stay.
            collection "wifi_devices" {
                name "Unused: MAC portal devices";
                description "Left over from the MAC-auth captive portal; always empty";

                roles {
                    read "admin";
                }

                key {
                    field {
                        name "Key";
                        type text;
                    }
                }
            }

            # Unused since the switch to Passpoint (2026-10-23). RadiatorDB
            # records the collection list at setup and refuses to start if a
            # collection disappears, so the old MAC-portal collections stay.
            collection "wifi_sessions" {
                name "Unused: MAC portal sessions";
                description "Left over from the MAC-auth captive portal; always empty";

                roles {
                    read "admin";
                }

                key {
                    field {
                        name "Key";
                        type text;
                    }
                }
            }

            # Unused since the switch to Passpoint (2026-10-23). RadiatorDB
            # records the collection list at setup and refuses to start if a
            # collection disappears, so the old MAC-portal collections stay.
            collection "wifi_handoffs" {
                name "Unused: MAC portal handoffs";
                description "Left over from the MAC-auth captive portal; always empty";

                roles {
                    read "admin";
                }

                key {
                    field {
                        name "Key";
                        type text;
                    }
                }
            }
        }
    }
  ui.radconf: |
    ui {
        sidebar {
            section "RadiatorDB";
            item "radiatordb" {
                url "/radiatordb/database?dbName=radiatordb";
                icon "Database";
            }
        }
    }
  wifi-provisioning.radconf: |
    # Passpoint onboarding for the SSID "dragonfruit-radiator" at
    # https://wifi.fruitiex.org (public and private gateway, HTTPRoute radiator-wifi).
    #
    # Radiator runs the Pocket ID sign-in itself (oidc "POCKET_ID", client
    # radiator-wifi, group family) for everything except /guest*. The callback
    # stores the user and groups in the WIFI_SESSION_* caches under a random
    # session id, sent back as the radiator_wifi_session cookie (8 h, HttpOnly,
    # SameSite=Lax); a restart signs everyone out.
    #
    # Radiator issues a random per-device EAP-TTLS/PAP credential
    # (argon2-hashed in RadiatorDB wifi_credentials, 365 days) and returns it as an
    # Android Passpoint config or an Apple configuration profile. The phone can be
    # on any network, including mobile data.
    #
    #   /                     your devices, add this device (family only)
    #   /profile/android|apple  issue a member credential (Default LAN)
    #   /revoke               revoke one of your own devices
    #   /admin                admins: every credential, revoke any
    #   /approve?t=           admins: approve a guest request (from its QR code)
    #   /oidc/callback        Pocket ID returns here after sign-in
    #   /guest                public: guest request with a QR code; once an admin
    #                         approves, the page offers the profile downloads
    #   /guest/profile/android|apple?t=  issue a guest credential (VLAN 81), once
    #
    # Revocation takes effect at the next authentication; Session-Timeout (8 h,
    # radius-policy.radconf) bounds how long a revoked device stays connected.

    clients {
        http "PORTAL_PROXY" {
            # Envoy Gateway data plane (pod network).
            client "GATEWAYS" {
                source {
                    ip 10.244.0.0/16;
                }
            }
        }
    }

    servers {
        http "PORTAL" {
            listen {
                protocol tcp;
                ip 0.0.0.0;
                port 8088;
            }
            clients "PORTAL_PROXY";
            populate_aaa_headers false;
            default_headers {
                "Cache-Control" "no-store";
                "X-Content-Type-Options" "nosniff";
            }

            # Dedicated client, restricted to the "family" group in Pocket ID.
            oidc "POCKET_ID" {
                issuer "https://id.fruitiex.org";
                client_id "radiator-wifi";
                client_secret env.RADIATOR_WIFI_OIDC_CLIENT_SECRET;
                redirect_url "https://wifi.fruitiex.org/oidc/callback";
                scopes "openid profile email groups";
                identity_claim "preferred_username";
            }
        }
    }

    # Portal sessions: random id (radiator_wifi_session cookie) -> user, groups.
    caches {
        cache "WIFI_SESSION_USERS" {
            timeout 8h;
        }

        cache "WIFI_SESSION_GROUPS" {
            timeout 8h;
        }
    }

    scripts {
        # Server-side QR code (SVG) for vars.qr_text -> vars.qr_svg, so the guest
        # page needs no external script.
        lua "QR_SVG" {
            content """
                -- Minimal QR code encoder (Luau: bit32, no bitwise operators) (byte mode, error correction level L, versions 1-5,
                -- single Reed-Solomon block). Returns an SVG string. No external resources.
                local band, bor, bxor, lshift, rshift = bit32.band, bit32.bor, bit32.bxor, bit32.lshift, bit32.rshift

                local function qr_svg(text)
                    -- Data codewords and EC codewords per block for versions 1-5, level L.
                    local caps = { {19, 7}, {34, 10}, {55, 15}, {80, 20}, {108, 26} }
                    local ver, ndata, nec
                    for v = 1, 5 do
                        if #text + 2 <= caps[v][1] then ver, ndata, nec = v, caps[v][1], caps[v][2]; break end
                    end
                    if not ver then return nil end

                    -- Bit stream: mode 0100 (byte), 8-bit length, data, terminator, padding.
                    local bits = {}
                    local function put(val, len)
                        for i = len - 1, 0, -1 do bits[#bits + 1] = band(rshift(val, i), 1) end
                    end
                    put(4, 4); put(#text, 8)
                    for i = 1, #text do put(text:byte(i), 8) end
                    for _ = 1, math.min(4, ndata * 8 - #bits) do bits[#bits + 1] = 0 end
                    while #bits % 8 ~= 0 do bits[#bits + 1] = 0 end
                    local data = {}
                    for i = 1, #bits, 8 do
                        local b = 0
                        for j = 0, 7 do b = bor(lshift(b, 1), bits[i + j]) end
                        data[#data + 1] = b
                    end
                    local pad = { 0xEC, 0x11 }
                    local p = 1
                    while #data < ndata do data[#data + 1] = pad[p]; p = 3 - p end

                    -- Reed-Solomon over GF(256) with polynomial 0x11D.
                    local exp, log = {}, {}
                    local x = 1
                    for i = 0, 254 do
                        exp[i] = x; log[x] = i
                        x = lshift(x, 1)
                        if band(x, 0x100) ~= 0 then x = bxor(x, 0x11D) end
                    end
                    for i = 255, 511 do exp[i] = exp[i - 255] end
                    local function mul(a, b)
                        if a == 0 or b == 0 then return 0 end
                        return exp[log[a] + log[b]]
                    end
                    local gen = { 1 }
                    for i = 0, nec - 1 do
                        local ng = {}
                        for j = 1, #gen + 1 do
                            ng[j] = bxor(gen[j] or 0, mul(gen[j - 1] or 0, exp[i]))
                        end
                        gen = ng
                    end
                    local rem = {}
                    for i = 1, nec do rem[i] = 0 end
                    for i = 1, ndata do
                        local f = bxor(data[i], rem[1])
                        table.remove(rem, 1); rem[nec] = 0
                        for j = 1, nec do rem[j] = bxor(rem[j], mul(gen[j + 1], f)) end
                    end
                    for i = 1, nec do data[#data + 1] = rem[i] end

                    -- Module matrix: m[r][c] = 0/1, f[r][c] = true for function patterns.
                    local n = 17 + 4 * ver
                    local m, f = {}, {}
                    for r = 0, n - 1 do m[r] = {}; f[r] = {} end
                    local function set(r, c, v) m[r][c] = v; f[r][c] = true end
                    local function finder(r0, c0)
                        for dr = -1, 7 do
                            for dc = -1, 7 do
                                local r, c = r0 + dr, c0 + dc
                                if r >= 0 and r < n and c >= 0 and c < n then
                                    local on = (dr >= 0 and dr <= 6 and (dc == 0 or dc == 6))
                                        or (dc >= 0 and dc <= 6 and (dr == 0 or dr == 6))
                                        or (dr >= 2 and dr <= 4 and dc >= 2 and dc <= 4)
                                    set(r, c, on and 1 or 0)
                                end
                            end
                        end
                    end
                    finder(0, 0); finder(0, n - 7); finder(n - 7, 0)
                    for i = 8, n - 9 do set(6, i, (i + 1) % 2); set(i, 6, (i + 1) % 2) end
                    if ver >= 2 then
                        local a = 4 * ver + 10
                        for dr = -2, 2 do
                            for dc = -2, 2 do
                                local on = math.max(math.abs(dr), math.abs(dc)) ~= 1
                                set(a + dr, a + dc, on and 1 or 0)
                            end
                        end
                    end
                    set(n - 8, 8, 1) -- dark module
                    -- Reserve format areas.
                    for i = 0, 8 do
                        if not f[8][i] then set(8, i, 0) end
                        if not f[i][8] then set(i, 8, 0) end
                    end
                    for i = 0, 7 do set(8, n - 1 - i, 0); set(n - 1 - i, 8, 0) end
                    set(n - 8, 8, 1)

                    -- Place data bits in the zigzag order.
                    local all = {}
                    for _, b in ipairs(data) do for i = 7, 0, -1 do all[#all + 1] = band(rshift(b, i), 1) end end
                    local k, up = 1, true
                    local c = n - 1
                    while c > 0 do
                        if c == 6 then c = 5 end
                        for i = 0, n - 1 do
                            local r = up and (n - 1 - i) or i
                            for dc = 0, 1 do
                                local cc = c - dc
                                if not f[r][cc] then
                                    m[r][cc] = all[k] or 0
                                    k = k + 1
                                end
                            end
                        end
                        up = not up
                        c = c - 2
                    end

                    -- Masks and penalty score; keep the best.
                    local masks = {
                        function(r, cc) return (r + cc) % 2 == 0 end,
                        function(r) return r % 2 == 0 end,
                        function(_, cc) return cc % 3 == 0 end,
                        function(r, cc) return (r + cc) % 3 == 0 end,
                        function(r, cc) return (r // 2 + cc // 3) % 2 == 0 end,
                        function(r, cc) return (r * cc) % 2 + (r * cc) % 3 == 0 end,
                        function(r, cc) return ((r * cc) % 2 + (r * cc) % 3) % 2 == 0 end,
                        function(r, cc) return ((r + cc) % 2 + (r * cc) % 3) % 2 == 0 end,
                    }
                    local function format_bits(mask)
                        local d = bor(8, mask) -- level L = 01
                        local v = lshift(d, 10)
                        for i = 14, 10, -1 do
                            if band(rshift(v, i), 1) == 1 then v = bxor(v, lshift(0x537, i - 10)) end
                        end
                        return bxor(bor(lshift(d, 10), v), 0x5412)
                    end
                    local function apply(mask)
                        local g = {}
                        for r = 0, n - 1 do
                            g[r] = {}
                            for cc = 0, n - 1 do
                                local v = m[r][cc]
                                if not f[r][cc] and masks[mask + 1](r, cc) then v = 1 - v end
                                g[r][cc] = v
                            end
                        end
                        local fb = format_bits(mask)
                        for i = 0, 14 do
                            local bit = band(rshift(fb, i), 1)
                            -- Around the top-left finder.
                            if i < 6 then g[i][8] = bit
                            elseif i < 8 then g[i + 1][8] = bit
                            else g[8][14 - i + (i == 8 and 1 or 0)] = bit end
                            -- Split copy: bottom-left and top-right.
                            if i < 8 then g[8][n - 1 - i] = bit else g[n - 15 + i][8] = bit end
                        end
                        g[n - 8][8] = 1
                        return g
                    end
                    local function penalty(g)
                        local s = 0
                        for r = 0, n - 1 do
                            local run, runr = 1, 1
                            for cc = 1, n - 1 do
                                if g[r][cc] == g[r][cc - 1] then run = run + 1 else
                                    if run >= 5 then s = s + run - 2 end; run = 1 end
                                if g[cc][r] == g[cc - 1][r] then runr = runr + 1 else
                                    if runr >= 5 then s = s + runr - 2 end; runr = 1 end
                            end
                            if run >= 5 then s = s + run - 2 end
                            if runr >= 5 then s = s + runr - 2 end
                        end
                        local dark = 0
                        for r = 0, n - 1 do for cc = 0, n - 1 do
                            dark = dark + g[r][cc]
                            if r < n - 1 and cc < n - 1 then
                                local v = g[r][cc]
                                if v == g[r + 1][cc] and v == g[r][cc + 1] and v == g[r + 1][cc + 1] then s = s + 3 end
                            end
                        end end
                        s = s + 10 * (math.abs(dark * 20 // (n * n) - 10))
                        return s
                    end
                    local best, bestscore
                    for mask = 0, 7 do
                        local g = apply(mask)
                        local sc = penalty(g)
                        if not bestscore or sc < bestscore then best, bestscore = g, sc end
                    end

                    -- SVG with a 4-module quiet zone.
                    local q = 4
                    local size = n + 2 * q
                    local parts = {}
                    for r = 0, n - 1 do
                        for cc = 0, n - 1 do
                            if best[r][cc] == 1 then
                                parts[#parts + 1] = "M" .. (cc + q) .. " " .. (r + q) .. "h1v1h-1z"
                            end
                        end
                    end
                    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' .. size .. ' ' .. size
                        .. '" class="qr" shape-rendering="crispEdges" role="img" aria-label="QR code">'
                        .. '<rect width="100%" height="100%" fill="#fff"/><path fill="#000" d="'
                        .. table.concat(parts) .. '"/></svg>'
                end

                local context, previous = ...
                local text = context.vars:get("qr_text")
                local svg = text and qr_svg(text)
                if svg then context.vars:set("qr_svg", svg) end
                return previous

                """;
        }
    }

    aaa {
        @pipeline "PAGE" {
            vars.page_head = """
                <!doctype html>
                <html lang="en">
                <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width,initial-scale=1">
                <title>dragonfruit Wi-Fi</title>
                <style>
                :root{color-scheme:light dark;--fg:#1d1d1f;--bg:#f2f2f7;--card:#fff;--muted:#6e6e73;--accent:#0b7a4b;--accent-fg:#fff}
                @media (prefers-color-scheme:dark){:root{--fg:#f5f5f7;--bg:#000;--card:#1c1c1e;--muted:#a1a1a6;--accent:#30d158;--accent-fg:#002b15}}
                body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
                main{box-sizing:border-box;width:100%;max-width:400px;margin:16px;padding:32px 24px;background:var(--card);border-radius:22px;text-align:center}
                h1{margin:0 0 8px;font-size:24px;line-height:1.2}
                p{margin:8px 0 20px;color:var(--muted)}
                .btn{display:block;box-sizing:border-box;width:100%;padding:16px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font:600 17px/1.2 inherit;text-decoration:none;cursor:pointer}
                .btn2{display:block;box-sizing:border-box;width:100%;margin-top:12px;padding:15px;border:1.5px solid var(--accent);border-radius:14px;background:transparent;color:var(--fg);font:600 17px/1.2 inherit;text-decoration:none;cursor:pointer}
                .link{box-sizing:border-box;width:100%;margin:4px 0 12px;padding:12px;border:1px solid var(--muted);border-radius:10px;background:var(--bg);color:var(--fg);font:15px/1.3 ui-monospace,monospace;-webkit-user-select:all;user-select:all}
                ol{margin:0 0 16px;padding-left:22px;text-align:left;color:var(--muted)}
                .field{box-sizing:border-box;width:100%;margin:0 0 12px;padding:14px;border:1px solid var(--muted);border-radius:12px;background:var(--bg);color:var(--fg);font:17px/1.2 inherit}
                h2{margin:28px 0 8px;font-size:18px;text-align:left}
                .list{margin:0;padding:0;list-style:none;text-align:left}
                .list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--bg)}
                .list small{color:var(--muted)}
                .small{padding:8px 12px;border:1px solid var(--muted);border-radius:10px;background:transparent;color:var(--fg);font:15px inherit;cursor:pointer}
                .note{padding:10px 12px;border-radius:10px;background:var(--bg);color:var(--fg)}
                code{font:13px/1.4 ui-monospace,monospace;word-break:break-all}
                .quiet{display:inline-block;margin-top:22px;color:var(--muted);font-size:15px}
                .qr{display:block;width:100%;max-width:260px;margin:4px auto 12px;border-radius:12px}
                .meta{font-size:14px;color:var(--muted);word-break:break-all}
                </style>
                </head>
                <body>
                <main>
                """;
            vars.page_foot = """
                </main>
                </body>
                </html>
                """;
        }

        # The signed-in user of the radiator_wifi_session cookie (CALLBACK).
        @pipeline "SSO_IDENTITY" {
            vars.session_id = http.cookie.radiator_wifi_session;
            vars.sso_user = cache.WIFI_SESSION_USERS[vars.session_id];
            vars.groups = cache.WIFI_SESSION_GROUPS[vars.session_id][*];
            vars.is_admin = "no";
            if all {
                vars.groups == "admins";
            } then {
                vars.is_admin = "yes";
            }
        }

        # Needs vars.owner, vars.kind, vars.vlan and vars.approved_by. Sets
        # vars.username and vars.password for the profile.
        @pipeline "ISSUE_WIFI_CREDENTIAL" {
            # Form bodies don't decode "+" to a space.
            vars.device_name = http.request.device_name | default("Device") | split("+") | join(" ") | substring(0, 40);
            vars.username = "d%{util.rand.10}";
            vars.password = "%{util.rand.24}";
            vars.password_hash = vars.password | password_hash("argon2");
            vars.created = datetime.timestamp.utc | timestamp_format;
            vars.revoked = false;
            # Public: Base64 of the DER root CA (ConfigMap radiator-passpoint-ca).
            vars.ca_der_b64 = env.PASSPOINT_CA_DER_B64;

            backend {
                name "radiatordb";
                query "SAVE_WIFI_CREDENTIAL";
            }
        }

        # Android: Base64 of a multipart/mixed message with the Passpoint R1
        # PerProviderSubscription MO and the root CA. Android matches the FQDN
        # against the AP's ANQP domain list and suffix-matches the RADIUS server
        # certificate's DNS SAN. Do not add AAAServerTrustedNames: it makes
        # Android ignore the CA below and use the system store.
        @pipeline "ANDROID_PROFILE_RESPONSE" {
            vars.pps = """
                <MgmtTree xmlns="syncml:dmddf1.2">
                  <VerDTD>1.2</VerDTD>
                  <Node>
                    <NodeName>PerProviderSubscription</NodeName>
                    <RTProperties><Type><DDFName>urn:wfa:mo:hotspot2dot0-perprovidersubscription:1.0</DDFName></Type></RTProperties>
                    <Node>
                      <NodeName>i001</NodeName>
                      <Node>
                        <NodeName>HomeSP</NodeName>
                        <Node><NodeName>FriendlyName</NodeName><Value>dragonfruit Wi-Fi</Value></Node>
                        <Node><NodeName>FQDN</NodeName><Value>fruitiex.org</Value></Node>
                      </Node>
                      <Node>
                        <NodeName>Credential</NodeName>
                        <Node><NodeName>Realm</NodeName><Value>fruitiex.org</Value></Node>
                        <Node>
                          <NodeName>UsernamePassword</NodeName>
                          <Node><NodeName>Username</NodeName><Value>%{vars.username}</Value></Node>
                          <Node><NodeName>Password</NodeName><Value>%{vars.password | base64_encode}</Value></Node>
                          <Node>
                            <NodeName>EAPMethod</NodeName>
                            <Node><NodeName>EAPType</NodeName><Value>21</Value></Node>
                            <Node><NodeName>InnerMethod</NodeName><Value>PAP</Value></Node>
                          </Node>
                        </Node>
                      </Node>
                    </Node>
                  </Node>
                </MgmtTree>
                """;

            vars.boundary = "fruitiex-%{util.rand.8}";
            vars.mime = """
                Content-Type: multipart/mixed; boundary=%{vars.boundary}
                Content-Transfer-Encoding: base64

                --%{vars.boundary}
                Content-Type: application/x-passpoint-profile
                Content-Transfer-Encoding: base64

                %{vars.pps | base64_encode}
                --%{vars.boundary}
                Content-Type: application/x-x509-ca-cert
                Content-Transfer-Encoding: base64

                %{vars.ca_der_b64}
                --%{vars.boundary}--
                """;

            http.status = http.OK;
            http.json = false;
            http.response_header.Content-Type = "application/x-wifi-config";
            http.response_header.Content-Disposition = "attachment; filename=\"dragonfruit-wifi.config\"";
            http.response = vars.mime | base64_encode;
        }

        # Apple: unsigned configuration profile (iOS shows "Unverified" but
        # installs it).
        @pipeline "APPLE_PROFILE_RESPONSE" {
            vars.ca_uuid = util.uuid4;
            vars.wifi_uuid = util.uuid4;
            vars.profile_uuid = util.uuid4;

            http.status = http.OK;
            http.json = false;
            http.response_header.Content-Type = "application/x-apple-aspen-config";
            http.response_header.Content-Disposition = "attachment; filename=\"dragonfruit-wifi.mobileconfig\"";
            http.response = """
                <?xml version="1.0" encoding="UTF-8"?>
                <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                <plist version="1.0">
                <dict>
                  <key>PayloadContent</key>
                  <array>
                    <dict>
                      <key>PayloadType</key><string>com.apple.security.root</string>
                      <key>PayloadIdentifier</key><string>org.fruitiex.wifi.%{vars.username}.ca</string>
                      <key>PayloadUUID</key><string>%{vars.ca_uuid}</string>
                      <key>PayloadVersion</key><integer>1</integer>
                      <key>PayloadDisplayName</key><string>fruitiex Wi-Fi Root CA</string>
                      <key>PayloadContent</key><data>%{vars.ca_der_b64}</data>
                    </dict>
                    <dict>
                      <key>PayloadType</key><string>com.apple.wifi.managed</string>
                      <key>PayloadIdentifier</key><string>org.fruitiex.wifi.%{vars.username}.passpoint</string>
                      <key>PayloadUUID</key><string>%{vars.wifi_uuid}</string>
                      <key>PayloadVersion</key><integer>1</integer>
                      <key>PayloadDisplayName</key><string>dragonfruit Wi-Fi</string>
                      <key>IsHotspot</key><true/>
                      <key>DomainName</key><string>fruitiex.org</string>
                      <key>NAIRealmNames</key><array><string>fruitiex.org</string></array>
                      <key>DisplayedOperatorName</key><string>dragonfruit</string>
                      <key>ServiceProviderRoamingEnabled</key><false/>
                      <key>AutoJoin</key><true/>
                      <key>EncryptionType</key><string>WPA2</string>
                      <key>EAPClientConfiguration</key>
                      <dict>
                        <key>AcceptEAPTypes</key><array><integer>21</integer></array>
                        <key>TTLSInnerAuthentication</key><string>PAP</string>
                        <key>UserName</key><string>%{vars.username}</string>
                        <key>UserPassword</key><string>%{vars.password}</string>
                        <key>OuterIdentity</key><string>anonymous@fruitiex.org</string>
                        <key>TLSTrustedServerNames</key><array><string>radius.fruitiex.org</string></array>
                        <key>PayloadCertificateAnchorUUID</key><array><string>%{vars.ca_uuid}</string></array>
                      </dict>
                    </dict>
                  </array>
                  <key>PayloadType</key><string>Configuration</string>
                  <key>PayloadIdentifier</key><string>org.fruitiex.wifi.%{vars.username}</string>
                  <key>PayloadUUID</key><string>%{vars.profile_uuid}</string>
                  <key>PayloadVersion</key><integer>1</integer>
                  <key>PayloadDisplayName</key><string>dragonfruit Wi-Fi (%{vars.device_name | xml_escape})</string>
                  <key>PayloadRemovalDisallowed</key><false/>
                </dict>
                </plist>
                """;
        }

        # vars.rows: the signed-in user's devices as <li> elements.
        @pipeline "OWN_DEVICE_ROWS" {
            vars.owner = vars.sso_user;
            vars.rows = "";
            # A user without devices gets a reject from the query.
            until end {
                backend {
                    name "radiatordb";
                    query "LIST_WIFI_CREDENTIALS";
                    @each {
                        if all {
                            vars.list_revoked != true;
                        } then {
                            vars.rows += """
                                <li><span>%{vars.list_device_name | xml_escape}<br><small>added %{vars.list_created | substring(0, 10)}</small></span>
                                <form method="post" action="/revoke"><input type="hidden" name="device" value="%{vars.list_username | xml_escape}"><button class="small" type="submit">Remove</button></form></li>
                                """;
                        }
                    }
                }
            } when reject {
                accept;
            }
        }

        # Linux: a NetworkManager keyfile for the SSID itself (NetworkManager has
        # no Passpoint). The CA is embedded as a blob (DER, Base64).
        @pipeline "LINUX_PROFILE_RESPONSE" {
            vars.nm_uuid = util.uuid4;
            http.status = http.OK;
            http.json = false;
            http.response_header.Content-Type = "application/octet-stream";
            http.response_header.Content-Disposition = "attachment; filename=\"dragonfruit-radiator.nmconnection\"";
            http.response = """
                [connection]
                id=dragonfruit-radiator
                uuid=%{vars.nm_uuid}
                type=wifi
                autoconnect=true

                [wifi]
                mode=infrastructure
                ssid=dragonfruit-radiator

                [wifi-security]
                key-mgmt=wpa-eap

                [802-1x]
                eap=ttls;
                anonymous-identity=anonymous@fruitiex.org
                identity=%{vars.username}
                password=%{vars.password}
                phase2-auth=pap
                ca-cert=data:;base64,%{vars.ca_der_b64}
                domain-suffix-match=radius.fruitiex.org
                system-ca-certs=false

                [ipv4]
                method=auto

                [ipv6]
                method=auto
                """;
        }

        @pipeline "FORBIDDEN_PAGE" {
            http.status = http.FORBIDDEN;
            http.response = """
                %{vars.page_head}
                <h1>Not allowed</h1>
                <p>%{vars.forbidden_reason}</p>
                %{vars.page_foot}
                """;
        }

        policy "WIFI_PORTAL" {
            conditions all {
                aaa.protocol == protocol.HTTP;
                http.server == "PORTAL";
            }

            # Pocket ID returns the browser here (oidc "POCKET_ID" redirect_url).
            handler "CALLBACK" {
                conditions all {
                    http.method == "GET";
                    http.path == "/oidc/callback";
                }

                @execute {
                    invoke "PAGE";
                    http.json = false;

                    until end {
                        oidc_complete "POCKET_ID";
                    } when reject {
                        accept;
                        vars.forbidden_reason = """%{aaa.reason}. <a href="/">Try again</a>""";
                        invoke "FORBIDDEN_PAGE";
                        reject;
                    }

                    if none {
                        oidc.claims.groups == "family";
                    } then {
                        vars.forbidden_reason = "This account can't add devices to the Wi-Fi network.";
                        invoke "FORBIDDEN_PAGE";
                        reject;
                    }

                    vars.session_id = util.rand.32 | base64url_encode;
                    cache {
                        cache "WIFI_SESSION_USERS";
                        key vars.session_id;
                        value aaa.identity;
                    }
                    cache {
                        cache "WIFI_SESSION_GROUPS";
                        key vars.session_id;
                        value oidc.claims.groups;
                    }

                    # Replaces oidc_complete's removal of the login state cookie,
                    # which then expires by itself (10 min, single use anyway).
                    http.response_header.Set-Cookie = "radiator_wifi_session=%{vars.session_id}; Path=/; Max-Age=28800; HttpOnly; Secure; SameSite=Lax";
                    http.status = http.SEE_OTHER;
                    # SIGN_IN only keeps paths it built itself.
                    http.response_header.Location = oidc.data | default("/");
                    http.response = none;
                    accept;
                }
            }

            # Signed-in pages without a portal session: sign in with Pocket ID,
            # then come back to the page (GET only; a POST restarts at /).
            handler "SIGN_IN" {
                conditions all {
                    http.path == /^\/(devices|profile\/(android|apple|linux)|revoke|admin|admin\/revoke|approve)?$/;
                    cache.WIFI_SESSION_USERS[http.cookie.radiator_wifi_session] == none;
                }

                @execute {
                    invoke "PAGE";
                    http.json = false;

                    # The home page's background refresh can't follow a sign-in.
                    if all {
                        http.path == "/devices";
                    } then {
                        http.status = http.UNAUTHORIZED;
                        http.response = "";
                        reject;
                    }

                    vars.return_to = "/";
                    if all {
                        http.method == "GET";
                        http.path == "/admin";
                    } then {
                        vars.return_to = "/admin";
                    } else if all {
                        http.method == "GET";
                        http.path == "/approve";
                        http.query.t == any;
                    } then {
                        vars.return_to = "/approve?t=%{http.query.t | url_escape}";
                    }

                    until end {
                        oidc_start "POCKET_ID" {
                            data vars.return_to;
                        }
                    } when error {
                        http.status = http.SERVICE_UNAVAILABLE;
                        http.response = """
                            %{vars.page_head}
                            <h1>Sign-in unavailable</h1>
                            <p>Pocket ID can't be reached. Try again in a moment.</p>
                            %{vars.page_foot}
                            """;
                        reject;
                    }
                }
            }

            handler "HOME" {
                conditions all {
                    http.method == "GET";
                    http.path == "/";
                    cache.WIFI_SESSION_USERS[http.cookie.radiator_wifi_session] == any;
                }

                @execute {
                    invoke "PAGE";
                    invoke "SSO_IDENTITY";
                    http.json = false;
                    invoke "OWN_DEVICE_ROWS";

                    vars.ff_note = "";
                    if all {
                        http.header.user-agent == /Android.*Firefox\//;
                    } then {
                        # Firefox saves the file instead of handing it to the
                        # Passpoint installer.
                        vars.ff_note = """<p class="note">To install on Android, open this page in Chrome.</p>""";
                    }

                    vars.admin_link = "";
                    if all {
                        vars.is_admin == "yes";
                    } then {
                        vars.admin_link = """<a class="quiet" href="/admin">All devices and guests</a>""";
                    }

                    if none {
                        vars.groups == "family";
                    } then {
                        vars.forbidden_reason = "This account can't add devices to the Wi-Fi network.";
                        invoke "FORBIDDEN_PAGE";
                        reject;
                    }

                    http.status = http.OK;
                    http.response = """
                        %{vars.page_head}
                        <h1>dragonfruit Wi-Fi</h1>
                        <p>Add this phone or computer. It then joins the Wi-Fi by itself, at home only.</p>
                        %{vars.ff_note}
                        <form method="post" id="add">
                        <input class="field" name="device_name" required maxlength="40" placeholder="Device name, e.g. Pixel" aria-label="Device name">
                        <button class="btn" formaction="/profile/android" type="submit">Add Android device</button>
                        <button class="btn2" formaction="/profile/apple" type="submit">Add iPhone, iPad or Mac (Passpoint)</button>
                        <button class="btn2" formaction="/profile/linux" type="submit">Add Linux computer (NetworkManager)</button>
                        </form>
                        <p class="meta">Linux: then run<br><code>sudo install -m600 ~/Downloads/dragonfruit-radiator.nmconnection /etc/NetworkManager/system-connections/ &amp;&amp; sudo nmcli connection reload</code></p>
                        <h2>Your devices</h2>
                        <ul class="list" id="devices">%{vars.rows | join("")}</ul>
                        <script>
                        // The profile comes back as a download, so the page stays as it
                        // was: block double taps for a few seconds and refresh the list.
                        // The form POST itself stays a normal top-level navigation, which
                        // is what hands application/x-wifi-config to Android's installer.
                        (function(){
                          var f = document.getElementById("add"), list = document.getElementById("devices");
                          f.addEventListener("submit", function(){
                            var bs = f.querySelectorAll("button"), n = 0;
                            setTimeout(function(){ bs.forEach(function(b){ b.disabled = true; }); }, 0);
                            setTimeout(function(){ bs.forEach(function(b){ b.disabled = false; }); }, 5000);
                            (function refresh(){
                              fetch("/devices", {cache: "no-store"}).then(function(r){ return r.ok ? r.text() : null; }).then(function(t){
                                if (t !== null) list.innerHTML = t;
                              }).catch(function(){});
                              if (++n < 8) setTimeout(refresh, 1500);
                            })();
                          });
                        })();
                        </script>
                        %{vars.admin_link}
                        %{vars.page_foot}
                        """;
                    accept;
                }
            }

            # The device list as an HTML fragment, for the home page's refresh.
            handler "DEVICES" {
                conditions all {
                    http.method == "GET";
                    http.path == "/devices";
                    cache.WIFI_SESSION_USERS[http.cookie.radiator_wifi_session] == any;
                }

                @execute {
                    invoke "SSO_IDENTITY";
                    invoke "OWN_DEVICE_ROWS";
                    http.json = false;
                    http.status = http.OK;
                    http.response = vars.rows | join("");
                    accept;
                }
            }

            handler "MEMBER_PROFILE" {
                conditions all {
                    http.method == "POST";
                    http.path == /^\/profile\/(android|apple|linux)$/;
                    cache.WIFI_SESSION_USERS[http.cookie.radiator_wifi_session] == any;
                }

                @execute {
                    invoke "PAGE";
                    invoke "SSO_IDENTITY";
                    http.json = false;

                    if none {
                        vars.groups == "family";
                    } then {
                        vars.forbidden_reason = "This account can't add devices to the Wi-Fi network.";
                        invoke "FORBIDDEN_PAGE";
                        reject;
                    }

                    vars.owner = vars.sso_user;
                    vars.kind = "member";
                    vars.approved_by = vars.sso_user;
                    # Members: the SSID's own network, the Default LAN.
                    vars.vlan = "lan";
                    invoke "ISSUE_WIFI_CREDENTIAL";

                    if all {
                        http.path == "/profile/android";
                    } then {
                        invoke "ANDROID_PROFILE_RESPONSE";
                    } else if all {
                        http.path == "/profile/linux";
                    } then {
                        invoke "LINUX_PROFILE_RESPONSE";
                    } else {
                        invoke "APPLE_PROFILE_RESPONSE";
                    }
                    accept;
                }
            }

            # Owners revoke their own devices; admins revoke any (/admin/revoke).
            handler "REVOKE" {
                conditions all {
                    http.method == "POST";
                    http.path == /^\/(admin\/)?revoke$/;
                    cache.WIFI_SESSION_USERS[http.cookie.radiator_wifi_session] == any;
                    http.request.device == any;
                }

                @execute {
                    invoke "PAGE";
                    invoke "SSO_IDENTITY";
                    http.json = false;
                    vars.username = http.request.device;
                    aaa.identity = vars.username;

                    until end {
                        backend {
                            name "radiatordb";
                            query "FIND_WIFI_CREDENTIAL";
                        }
                    } when reject {
                        accept;
                        http.status = http.NOT_FOUND;
                        http.response = """
                            %{vars.page_head}
                            <h1>Device not found</h1>
                            <p><a href="/">Back</a></p>
                            %{vars.page_foot}
                            """;
                        reject;
                    }

                    if any {
                        vars.owner == vars.sso_user;
                        vars.is_admin == "yes";
                    } then {
                        backend {
                            name "radiatordb";
                            query "REVOKE_WIFI_CREDENTIAL";
                        }
                    } else {
                        vars.forbidden_reason = "You can only remove your own devices.";
                        invoke "FORBIDDEN_PAGE";
                        reject;
                    }

                    http.status = http.SEE_OTHER;
                    http.response_header.Location = "/";
                    if all {
                        http.path == "/admin/revoke";
                    } then {
                        http.response_header.Location = "/admin";
                    }
                    http.response = none;
                    accept;
                }
            }

            handler "ADMIN" {
                conditions all {
                    http.method == "GET";
                    http.path == "/admin";
                    cache.WIFI_SESSION_USERS[http.cookie.radiator_wifi_session] == any;
                }

                @execute {
                    invoke "PAGE";
                    invoke "SSO_IDENTITY";
                    http.json = false;

                    if all {
                        vars.is_admin != "yes";
                    } then {
                        vars.forbidden_reason = "Only admins can see all devices.";
                        invoke "FORBIDDEN_PAGE";
                        reject;
                    }

                    vars.rows = "";
                    until end {
                        backend {
                            name "radiatordb";
                            query "LIST_ALL_WIFI_CREDENTIALS";
                            @each {
                                if all {
                                    vars.list_revoked != true;
                                } then {
                                    vars.rows += """
                                        <li><span>%{vars.list_device_name | xml_escape}<br><small>%{vars.list_kind | default("") | xml_escape}: %{vars.list_owner | default("") | xml_escape}, approved by %{vars.list_approved_by | default("") | xml_escape}, %{vars.list_created | substring(0, 10)}</small></span>
                                        <form method="post" action="/admin/revoke"><input type="hidden" name="device" value="%{vars.list_username | xml_escape}"><button class="small" type="submit">Revoke</button></form></li>
                                        """;
                                }
                            }
                        }
                    } when reject {
                        accept;
                    }

                    http.status = http.OK;
                    http.response = """
                        %{vars.page_head}
                        <h1>All Wi-Fi devices</h1>
                        <p>Guests: show them https://wifi.fruitiex.org/guest and scan their code.</p>
                        <ul class="list">%{vars.rows | join("")}</ul>
                        <a class="quiet" href="/">Back</a>
                        %{vars.page_foot}
                        """;
                    accept;
                }
            }

            # Admins approve a guest request by scanning its QR code.
            handler "APPROVE" {
                conditions all {
                    http.path == "/approve";
                    cache.WIFI_SESSION_USERS[http.cookie.radiator_wifi_session] == any;
                    http.query.t == any;
                }

                @execute {
                    invoke "PAGE";
                    invoke "SSO_IDENTITY";
                    http.json = false;
                    vars.token = http.query.t;

                    if all {
                        vars.is_admin != "yes";
                    } then {
                        vars.forbidden_reason = "Only admins can approve guests.";
                        invoke "FORBIDDEN_PAGE";
                        reject;
                    }

                    until end {
                        backend {
                            name "radiatordb";
                            query "FIND_GUEST_REQUEST";
                        }
                    } when reject {
                        accept;
                        http.status = http.NOT_FOUND;
                        http.response = """
                            %{vars.page_head}
                            <h1>Request expired</h1>
                            <p>Ask the guest to open the guest page again for a new code.</p>
                            %{vars.page_foot}
                            """;
                        reject;
                    }

                    if all {
                        vars.request_status != "pending";
                    } then {
                        http.status = http.OK;
                        http.response = """
                            %{vars.page_head}
                            <h1>Already approved</h1>
                            <p>Approved by %{vars.approved_by | default("") | xml_escape}.</p>
                            %{vars.page_foot}
                            """;
                        accept;
                    } else if all {
                        http.method == "POST";
                    } then {
                        vars.request_status = "approved";
                        vars.approved_by = vars.sso_user;
                        backend {
                            name "radiatordb";
                            query "SAVE_GUEST_REQUEST";
                        }
                        http.status = http.OK;
                        http.response = """
                            %{vars.page_head}
                            <h1>Guest approved</h1>
                            <p>Their phone now offers the Wi-Fi profile download. It works for a year; revoke it any time under <a href="/admin">All devices</a>.</p>
                            %{vars.page_foot}
                            """;
                        accept;
                    } else {
                        http.status = http.OK;
                        http.response = """
                            %{vars.page_head}
                            <h1>Let this guest in?</h1>
                            <p>They get internet access on the guest network for a year.</p>
                            <p class="meta">Code %{vars.token | substring(0, 4)}, requested %{vars.requested | substring(11, 16)} UTC</p>
                            <form method="post" action="/approve?t=%{vars.token | url_escape}">
                            <button class="btn" type="submit">Approve guest</button>
                            </form>
                            %{vars.page_foot}
                            """;
                        accept;
                    }
                }
            }

            # Public (no sign-in): guest request with a QR code for an admin.
            handler "GUEST" {
                conditions all {
                    http.method == "GET";
                    http.path == "/guest";
                }

                @execute {
                    invoke "PAGE";
                    http.json = false;

                    # The random 64-bit context id names the request.
                    vars.token = "%{context.id}";
                    vars.request_status = "pending";
                    vars.approved_by = "";
                    vars.requested = datetime.timestamp.utc | timestamp_format;
                    backend {
                        name "radiatordb";
                        query "SAVE_GUEST_REQUEST";
                    }
                    vars.qr_text = "https://wifi.fruitiex.org/approve?t=%{vars.token}";
                    script "QR_SVG";

                    http.status = http.OK;
                    http.response = """
                        %{vars.page_head}
                        <h1>Guest Wi-Fi</h1>
                        <div id="q">
                        <p>Show this code to your host. They scan it with their phone to let you in.</p>
                        %{vars.qr_svg}
                        <p class="meta">Code %{vars.token | substring(0, 4)}</p>
                        </div>
                        <div id="ok" hidden>
                        <p>Approved. Add the Wi-Fi to this device; it then joins by itself.</p>
                        <form method="post">
                        <input class="field" name="device_name" maxlength="40" placeholder="Device name (optional)" aria-label="Device name">
                        <button class="btn" formaction="/guest/profile/android?t=%{vars.token}" type="submit">Add Android device</button>
                        <button class="btn2" formaction="/guest/profile/apple?t=%{vars.token}" type="submit">Add iPhone, iPad or Mac (Passpoint)</button>
                        </form>
                        </div>
                        <script>
                        (function(){
                          var t = "%{vars.token}";
                          function poll(){
                            fetch("/guest/status?t=" + t, {cache: "no-store"}).then(function(r){ return r.json(); }).then(function(j){
                              if (j.status === "approved") {
                                document.getElementById("q").hidden = true;
                                document.getElementById("ok").hidden = false;
                              } else if (j.status === "expired") {
                                location.reload();
                              } else if (j.status === "pending") {
                                setTimeout(poll, 3000);
                              }
                            }).catch(function(){ setTimeout(poll, 3000); });
                          }
                          setTimeout(poll, 3000);
                        })();
                        </script>
                        %{vars.page_foot}
                        """;
                    accept;
                }
            }

            handler "GUEST_STATUS" {
                conditions all {
                    http.method == "GET";
                    http.path == "/guest/status";
                    http.query.t == any;
                }

                @execute {
                    vars.token = http.query.t;
                    http.status = http.OK;
                    http.response.status = "expired";

                    until end {
                        backend {
                            name "radiatordb";
                            query "FIND_GUEST_REQUEST";
                        }
                    } when accept {
                        http.response.status = vars.request_status;
                    } else {
                        accept;
                    }
                    accept;
                }
            }

            # Public: issues the guest credential once the request is approved.
            # Single use: the request is then marked "issued".
            handler "GUEST_PROFILE" {
                conditions all {
                    http.method == "POST";
                    http.path == /^\/guest\/profile\/(android|apple)$/;
                    http.query.t == any;
                }

                @execute {
                    invoke "PAGE";
                    http.json = false;
                    vars.token = http.query.t;

                    until end {
                        backend {
                            name "radiatordb";
                            query "FIND_GUEST_REQUEST";
                        }
                    } when reject {
                        accept;
                        vars.request_status = "expired";
                    }

                    if all {
                        vars.request_status != "approved";
                    } then {
                        http.status = http.FORBIDDEN;
                        http.response = """
                            %{vars.page_head}
                            <h1>Not available</h1>
                            <p>This code isn't approved, has expired or was already used. Open the guest page again for a new code.</p>
                            %{vars.page_foot}
                            """;
                        reject;
                    }

                    # Mark it used first, so a second download can't race it.
                    vars.request_status = "issued";
                    backend {
                        name "radiatordb";
                        query "SAVE_GUEST_REQUEST";
                    }

                    vars.owner = "guest";
                    vars.kind = "guest";
                    # VLAN 81 "Wi-Fi guests": internet only.
                    vars.vlan = "81";
                    invoke "ISSUE_WIFI_CREDENTIAL";

                    if all {
                        http.path == "/guest/profile/android";
                    } then {
                        invoke "ANDROID_PROFILE_RESPONSE";
                    } else {
                        invoke "APPLE_PROFILE_RESPONSE";
                    }
                    accept;
                }
            }

            handler "NOT_FOUND" {
                @execute {
                    invoke "PAGE";
                    http.json = false;
                    http.status = http.NOT_FOUND;
                    http.response = """
                        %{vars.page_head}
                        <h1>Not found</h1>
                        <p><a href="/">dragonfruit Wi-Fi</a></p>
                        %{vars.page_foot}
                        """;
                    reject;
                }
            }
        }
    }
---
# Public root CA of the Passpoint Wi-Fi PKI, embedded in the device profiles
# (wifi-provisioning.radconf). The server certificate and key are in
# radiator-passpoint-tls; the CA key is offline (pki/ca-key.sops.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: radiator-passpoint-ca
  namespace: default
data:
  # openssl x509 -in ca.pem -outform DER | base64 -w0
  der-b64: 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radiator-config
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radiator-postgres-data
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: radiator-postgres
  namespace: default
spec:
  selector:
    app: radiator-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radiator-postgres
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radiator-postgres
  template:
    metadata:
      labels:
        app: radiator-postgres
    spec:
      priorityClassName: homelab-home
      containers:
        - name: postgres
          image: postgres:18@sha256:f4b419e350fd98d4a8429603295208976dea4c8fb8326d818d346d3e29f1db6f
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: radiatordb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: 48Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: radiator-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: radiator-radius
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/hostname: radius.fruitiex.org
    metallb.universe.tf/loadBalancerIPs: 192.168.11.98
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: radiator
  ports:
    - name: radius-auth
      protocol: UDP
      port: 1812
      targetPort: 1812
    - name: radius-acct
      protocol: UDP
      port: 1813
      targetPort: 1813
    - name: radsec
      protocol: TCP
      port: 2083
      targetPort: 2083
---
apiVersion: v1
kind: Service
metadata:
  name: radiator-management
  namespace: default
spec:
  selector:
    app: radiator
  ports:
    - name: management
      protocol: TCP
      port: 8443
      targetPort: 8443
---
# Passpoint onboarding behind https://wifi.fruitiex.org (HTTPRoute radiator-wifi).
apiVersion: v1
kind: Service
metadata:
  name: radiator-portal
  namespace: default
spec:
  selector:
    app: radiator
  ports:
    - name: portal
      protocol: TCP
      port: 8088
      targetPort: 8088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radiator
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radiator
  template:
    metadata:
      labels:
        app: radiator
    spec:
      priorityClassName: homelab-home
      # Private Zot image (node-reader). The nodes' Talos registry auth only
      # takes effect after containerd restarts.
      imagePullSecrets:
        - name: radiator-registry
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: initialize-config
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
          args:
            - >-
              if [ ! -f /var/lib/radiator/.bootstrap-complete-v15 ]; then
                rm -f /var/lib/radiator/*.radconf /var/lib/radiator/..data;
                rm -rf /var/lib/radiator/..20*;
                for config in /bootstrap/*.radconf; do
                  cp -L "$config" "/var/lib/radiator/$(basename "$config")";
                done;
                touch /var/lib/radiator/.bootstrap-complete-v15;
              fi;
              mkdir -p /var/lib/radiator/licenses /var/lib/radiator/tmp /var/lib/radiator/management/tls/certs /var/lib/radiator/management/tls/keys /var/log/radiator;
              chown -R 1000:1000 /var/lib/radiator /var/log/radiator;
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          volumeMounts:
            - name: bootstrap-config
              mountPath: /bootstrap
              readOnly: true
            - name: radiator-config
              mountPath: /var/lib/radiator
            - name: radiator-logs
              mountPath: /var/log/radiator
        - name: wait-for-postgres
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
          args:
            - >-
              until nc -z -w 1 radiator-postgres.default.svc.cluster.local 5432;
              do echo 'waiting for PostgreSQL'; sleep 2; done
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
      containers:
        - name: radiator
          # Custom build with native OpenID Connect sign-in
          # (tag feature-oidc-55c73ac70b4d).
          image: nectarine.internal.fruitiex.org:5050/private/radiator-server@sha256:351de7ee1ce0d817d4f12e748f0193c5ade116ba1b951b3a0c11100b96aee437
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RADIUS_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: RADIUS_SHARED_SECRET
            - name: RADIATORDB_DB_HOST
              value: radiator-postgres.default.svc.cluster.local
            - name: RADIATORDB_DB_USER
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: POSTGRES_USER
            - name: RADIATORDB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radiator-secrets
                  key: POSTGRES_PASSWORD
            # Pocket ID clients: radiator-ui (management.radconf) and
            # radiator-wifi (wifi-provisioning.radconf).
            - name: RADIATOR_UI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: radiator-ui-oidc
                  key: client-secret
            - name: RADIATOR_WIFI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: radiator-wifi-oidc
                  key: client-secret
            # Public root CA for the Passpoint device profiles.
            - name: PASSPOINT_CA_DER_B64
              valueFrom:
                configMapKeyRef:
                  name: radiator-passpoint-ca
                  key: der-b64
          ports:
            - name: management
              containerPort: 8443
              protocol: TCP
            - name: radius-auth
              containerPort: 1812
              protocol: UDP
            - name: radius-acct
              containerPort: 1813
              protocol: UDP
            - name: radsec
              containerPort: 2083
              protocol: TCP
            - name: portal
              containerPort: 8088
              protocol: TCP
          volumeMounts:
            - name: radiator-config
              mountPath: /var/lib/radiator
            - name: management-certificate
              mountPath: /var/lib/radiator/management/tls/certs
              readOnly: true
            - name: management-key
              mountPath: /var/lib/radiator/management/tls/keys
              readOnly: true
            - name: management-users
              mountPath: /etc/radiator/management-users
              readOnly: true
            - name: radiator-logs
              mountPath: /var/log/radiator
            - name: passpoint-tls
              mountPath: /var/lib/radiator/passpoint/tls
              readOnly: true
            # Loaded from <config dir>/licenses; read-only, so licenses can't be
            # uploaded in Radiator UI.
            - name: license
              mountPath: /var/lib/radiator/licenses
              readOnly: true
          livenessProbe:
            httpGet:
              path: /live
              port: management
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: management
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: 100Mi
            limits:
              cpu: 1000m
              memory: 100Mi
      volumes:
        - name: bootstrap-config
          configMap:
            name: radiator-bootstrap-config
        - name: management-certificate
          secret:
            secretName: fruitiex-org-tls
            items:
              - key: tls.crt
                path: MANAGEMENT_API_CERT.pem
        - name: management-key
          secret:
            secretName: fruitiex-org-tls
            items:
              - key: tls.key
                path: MANAGEMENT_API_KEY.pem
        - name: management-users
          secret:
            secretName: radiator-secrets
            items:
              - key: MANAGEMENT_USERS_JSON
                path: management-users.json
        - name: radiator-config
          persistentVolumeClaim:
            claimName: radiator-config
        - name: radiator-logs
          emptyDir: {}
        - name: passpoint-tls
          secret:
            secretName: radiator-passpoint-tls
        - name: license
          secret:
            secretName: radiator-license
            items:
              - key: homelab.radlicense
                path: homelab.radlicense
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiator-management
  namespace: default
spec:
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - radiator.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: radiator-management
          port: 8443
---
# Passpoint onboarding (wifi-provisioning.radconf). On both gateways, so
# phones can add themselves over mobile data; the DNS name is the
# *.fruitiex.org wildcard (public address), hence no external-dns record.
# Radiator runs the Pocket ID sign-in itself (client radiator-wifi); /guest
# needs none.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiator-wifi
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - wifi.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: radiator-portal
          port: 8088
