# Pocket ID sign-in at the private gateway for the Radiator management UI
# (radiator.fruitiex.org) and the Wi-Fi captive portal (wifi.fruitiex.org).
#
# Envoy validates the ID token and forwards x-sso-user / x-sso-groups (the
# groups header is Base64 of the JSON array, Envoy's format for array claims).
# Client copies of x-sso-* are removed by the private gateway's
# ClientTrafficPolicy, and the HTTPRouteFilter injects the proxy secret that
# Radiator checks before trusting the headers (management-auth.radconf).
# Members of "admins" get full privileges, other users monitor-only.
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: radiator-proxy-secret
  namespace: default
spec:
  credentialInjection:
    header: x-radiator-proxy-secret
    overwrite: true
    credential:
      valueRef:
        name: radiator-proxy-secret
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pocket-id-radiator-management
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radiator-management
  oidc:
    provider:
      issuer: https://id.fruitiex.org
    # Shared admins-only gateway client.
    clientID: homelab-gateway
    clientSecret:
      name: pocket-id-gateway
      namespace: envoy-gateway-system
    scopes: [openid, profile, email, groups, offline_access]
    redirectURL: https://radiator.fruitiex.org/oauth2/callback
    logoutPath: /oauth2/logout
    refreshToken: true
    defaultRefreshTokenTTL: 8760h
    # Raw ID token for the JWT provider below; the OAuth2 filter strips client
    # copies of this header.
    forwardIDToken:
      header: x-sso-id-token
  jwt:
    providers:
      - name: pocket-id
        issuer: https://id.fruitiex.org
        audiences: [homelab-gateway]
        remoteJWKS:
          uri: https://id.fruitiex.org/.well-known/jwks.json
        extractFrom:
          headers:
            - name: x-sso-id-token
        claimToHeaders:
          - header: x-sso-user
            claim: preferred_username
          - header: x-sso-groups
            claim: groups
---
# Wi-Fi portal, public part: landing page, guest request and status, and
# /activate (wifi-portal.radconf). x-portal-client-ip is the TCP peer address
# (the private gateway Service uses externalTrafficPolicy Local), i.e. the
# device's walled-garden IP; set here so clients can't choose it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiator-wifi
  namespace: default
spec:
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - wifi.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: radiator-proxy-secret
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-portal-client-ip
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      backendRefs:
        - name: radiator-portal
          port: 8088
---
# Wi-Fi portal, signed-in part: member sign-in (/signin) and guest approval
# (/approve, admins only, checked by Radiator) behind Pocket ID.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiator-wifi-signin
  namespace: default
  annotations:
    # The record comes from the radiator-wifi route.
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - wifi.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /signin
        - path:
            type: PathPrefix
            value: /approve
        - path:
            type: PathPrefix
            value: /oauth2/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: radiator-proxy-secret
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-portal-client-ip
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      backendRefs:
        - name: radiator-portal
          port: 8088
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pocket-id-radiator-wifi
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radiator-wifi-signin
  oidc:
    provider:
      issuer: https://id.fruitiex.org
    # Dedicated client, restricted to the "family" group in Pocket ID.
    clientID: radiator-wifi
    clientSecret:
      name: radiator-wifi-oidc
    scopes: [openid, profile, email, groups]
    redirectURL: https://wifi.fruitiex.org/oauth2/callback
    logoutPath: /oauth2/logout
    forwardIDToken:
      header: x-sso-id-token
  jwt:
    providers:
      - name: pocket-id
        issuer: https://id.fruitiex.org
        audiences: [radiator-wifi]
        remoteJWKS:
          uri: https://id.fruitiex.org/.well-known/jwks.json
        extractFrom:
          headers:
            - name: x-sso-id-token
        claimToHeaders:
          - header: x-sso-user
            claim: preferred_username
          - header: x-sso-groups
            claim: groups
---
# Browser handoff from the captive window (wifi-portal.radconf, /handoff):
# only /signin (with the ?h= token) and the OIDC callback, on the public
# gateway, because Android sends browser traffic over mobile data while the
# Wi-Fi is unvalidated. A separate hostname keeps wifi.fruitiex.org private
# (its DNS record points at the private gateway); this one uses the
# *.fruitiex.org wildcard record. The device comes from the token, never
# from the client address. The public gateway's ClientTrafficPolicy drops
# client copies of x-sso-*.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiator-wifi-handoff
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - wifi-signin.fruitiex.org
  rules:
    - matches:
        - path:
            type: Exact
            value: /signin
        - path:
            type: PathPrefix
            value: /oauth2/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: radiator-proxy-secret
      backendRefs:
        - name: radiator-portal
          port: 8088
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pocket-id-radiator-wifi-handoff
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radiator-wifi-handoff
  oidc:
    provider:
      issuer: https://id.fruitiex.org
    # Same client as wifi.fruitiex.org, restricted to "family" in Pocket ID.
    clientID: radiator-wifi
    clientSecret:
      name: radiator-wifi-oidc
    scopes: [openid, profile, email, groups]
    redirectURL: https://wifi-signin.fruitiex.org/oauth2/callback
    logoutPath: /oauth2/logout
    forwardIDToken:
      header: x-sso-id-token
  jwt:
    providers:
      - name: pocket-id
        issuer: https://id.fruitiex.org
        audiences: [radiator-wifi]
        remoteJWKS:
          uri: https://id.fruitiex.org/.well-known/jwks.json
        extractFrom:
          headers:
            - name: x-sso-id-token
        claimToHeaders:
          - header: x-sso-user
            claim: preferred_username
          - header: x-sso-groups
            claim: groups
