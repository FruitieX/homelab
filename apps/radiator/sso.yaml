# Pocket ID sign-in for the Radiator management UI (radiator.fruitiex.org,
# private gateway) and the Passpoint Wi-Fi onboarding (wifi.fruitiex.org,
# public and private gateway).
#
# Envoy validates the ID token and forwards x-sso-user / x-sso-groups (the
# groups header is Base64 of the JSON array, Envoy's format for array claims).
# Client copies of x-sso-* are removed by both gateways' ClientTrafficPolicies, and the HTTPRouteFilter injects the proxy secret that
# Radiator checks before trusting the headers (management-auth.radconf).
# Members of "admins" get full privileges, other users monitor-only.
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: radiator-proxy-secret
  namespace: default
spec:
  credentialInjection:
    header: x-radiator-proxy-secret
    overwrite: true
    credential:
      valueRef:
        name: radiator-proxy-secret
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pocket-id-radiator-management
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radiator-management
  oidc:
    provider:
      issuer: https://id.fruitiex.org
    # Shared admins-only gateway client.
    clientID: homelab-gateway
    clientSecret:
      name: pocket-id-gateway
      namespace: envoy-gateway-system
    scopes: [openid, profile, email, groups, offline_access]
    redirectURL: https://radiator.fruitiex.org/oauth2/callback
    logoutPath: /oauth2/logout
    refreshToken: true
    defaultRefreshTokenTTL: 8760h
    # Raw ID token for the JWT provider below; the OAuth2 filter strips client
    # copies of this header.
    forwardIDToken:
      header: x-sso-id-token
  jwt:
    providers:
      - name: pocket-id
        issuer: https://id.fruitiex.org
        audiences: [homelab-gateway]
        remoteJWKS:
          uri: https://id.fruitiex.org/.well-known/jwks.json
        extractFrom:
          headers:
            - name: x-sso-id-token
        claimToHeaders:
          - header: x-sso-user
            claim: preferred_username
          - header: x-sso-groups
            claim: groups
---
# Passpoint onboarding (wifi-provisioning.radconf). On both gateways, so
# phones can add themselves over mobile data; the DNS name is the
# *.fruitiex.org wildcard (public address), hence no external-dns record.
# Everything except /guest is behind Pocket ID (client radiator-wifi, group
# family; Radiator re-checks family, and admins for /admin and /approve).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiator-wifi
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - wifi.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: radiator-proxy-secret
      backendRefs:
        - name: radiator-portal
          port: 8088
---
# Guest requests (/guest, /guest/status, /guest/profile/*) need no sign-in:
# the guest has no account. An admin approves the request at /approve.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiator-wifi-guest
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
    - name: private
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - wifi.fruitiex.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /guest
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: radiator-proxy-secret
      backendRefs:
        - name: radiator-portal
          port: 8088
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pocket-id-radiator-wifi
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radiator-wifi
  oidc:
    provider:
      issuer: https://id.fruitiex.org
    # Dedicated client, restricted to the "family" group in Pocket ID.
    clientID: radiator-wifi
    clientSecret:
      name: radiator-wifi-oidc
    scopes: [openid, profile, email, groups]
    redirectURL: https://wifi.fruitiex.org/oauth2/callback
    logoutPath: /oauth2/logout
    forwardIDToken:
      header: x-sso-id-token
  jwt:
    providers:
      - name: pocket-id
        issuer: https://id.fruitiex.org
        audiences: [radiator-wifi]
        remoteJWKS:
          uri: https://id.fruitiex.org/.well-known/jwks.json
        extractFrom:
          headers:
            - name: x-sso-id-token
        claimToHeaders:
          - header: x-sso-user
            claim: preferred_username
          - header: x-sso-groups
            claim: groups
