apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ntfy
  namespace: flux-system
spec:
  interval: 30m
  timeout: 3m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/ntfy
  prune: true
  wait: true
  dependsOn:
    - name: envoy-gateway-config
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
