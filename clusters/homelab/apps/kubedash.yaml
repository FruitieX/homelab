apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubedash
  namespace: flux-system
spec:
  interval: 30m
  timeout: 3m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/kubedash
  prune: true
  wait: true
  dependsOn:
    - name: envoy-gateway-config
