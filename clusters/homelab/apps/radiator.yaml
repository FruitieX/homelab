apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radiator
  namespace: flux-system
spec:
  interval: 99999h
  timeout: 5m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/radiator
  prune: true
  wait: true
  dependsOn:
    - name: csi-driver-nfs
    - name: envoy-gateway-config
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
