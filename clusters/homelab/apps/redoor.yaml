apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redoor
spec:
  interval: 30m
  timeout: 3m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/redoor
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
