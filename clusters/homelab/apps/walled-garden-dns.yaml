apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: walled-garden-dns
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/walled-garden-dns
  prune: true
  wait: true
