apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spliit
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/spliit
  prune: true
  dependsOn:
    - name: envoy-gateway-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
