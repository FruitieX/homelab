apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns
spec:
  interval: 30m
  timeout: 3m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/networking/coredns
  # Patches Talos' CoreDNS Deployment; never prune it.
  prune: false
  wait: true
