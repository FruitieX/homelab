apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot-retention
spec:
  interval: 30m
  timeout: 5m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/registry/retention
  prune: true
  wait: true
  dependsOn:
    - name: kube-prometheus-stack
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
