apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-upgrade
spec:
  interval: 30m
  timeout: 5m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/system-upgrade/controller
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-upgrade-plans
spec:
  dependsOn:
    - name: system-upgrade
  interval: 30m
  timeout: 5m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/system-upgrade/plans
  prune: true
