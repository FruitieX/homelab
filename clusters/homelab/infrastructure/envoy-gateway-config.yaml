apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/networking/envoy-gateway/config
  prune: true
  wait: true
  dependsOn:
    - name: envoy-gateway
    - name: crds
    - name: reflector
